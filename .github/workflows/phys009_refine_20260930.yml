name: PHYS009 pronunciation refinement
on:
  push:
    paths: ['.github/workflows/phys009_refine_20260930.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover full commissioned sentences
        run: |
          python -m pip -q install playwright requests av faster-whisper
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p refined
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,urllib.parse,requests,av
          from playwright.sync_api import sync_playwright
          from faster_whisper import WhisperModel
          pages={'02':'324f7a1314b94aed9122f78acd970209','04':'bccca38888bd4ff69325aac55a7a8611','05':'5da93fa6c5794ad49f480cd5ac6bb675'}
          records=[]
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              for number,cid in pages.items():
                  page=browser.new_page()
                  page.goto('https://www.aidocmaker.com/g0/audio?name='+cid,wait_until='domcontentloaded',timeout=90000)
                  sources=[]
                  for attempt in range(75):
                      sources=page.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                      if sources:break
                      page.wait_for_timeout(1000)
                  assert sources,'No playable source '+number
                  src=sources[0];u=urllib.parse.urlparse(src)
                  assert u.scheme=='https' and u.netloc=='storage.googleapis.com'
                  print('::add-mask::'+src)
                  r=requests.get(src,timeout=75);r.raise_for_status()
                  p=Path('refined',number+'.mp3');p.write_bytes(r.content)
                  a=av.open(str(p));duration=a.duration/av.time_base;count=sum(1 for frame in a.decode(audio=0));assert 2<duration<30 and count>10
                  records.append({'file':p.name,'context_id':cid,'duration':duration,'sha256':hashlib.sha256(r.content).hexdigest(),'decoded_frames':count})
                  page.close()
              browser.close()
          Path('refined/retrieval.json').write_text(json.dumps(records,indent=2))
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(Path('refined').glob('*.mp3')):
              segs,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              d={'file':p.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segs]}
              p.with_name(p.stem+'_words.json').write_text(json.dumps(d,ensure_ascii=False,indent=2));print(p.name,info.duration,[s['text'] for s in d['segments']])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phys009-refined-narration
          path: refined/
          retention-days: 1
