name: Astrophage pronunciation refinement
on:
  push:
    paths: ['.github/workflows/astrophage_voice_20260928.yml']
permissions:
  contents: read
jobs:
  refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover and align two replacement sentences
        run: |
          python -m pip -q install playwright requests av faster-whisper
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p refined
          python - <<'PY'
          from pathlib import Path
          import requests,json,urllib.parse,hashlib,av
          from playwright.sync_api import sync_playwright
          from faster_whisper import WhisperModel
          # Public, durable playback identifiers for the commissioned science narration.
          pages={'02':'bfd97dabf77349578e59465342887cb2','05':'042961de95804e6c846b6a783ac50053'}
          records=[]
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              for number,cid in pages.items():
                  page=browser.new_page()
                  page.goto('https://www.aidocmaker.com/g0/audio?name='+cid,wait_until='domcontentloaded',timeout=90000)
                  sources=[]
                  for attempt in range(60):
                      sources=page.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                      if sources:break
                      page.wait_for_timeout(1000)
                  assert sources
                  src=sources[0];u=urllib.parse.urlparse(src)
                  assert u.scheme=='https' and u.netloc=='storage.googleapis.com'
                  print('::add-mask::'+src)
                  r=requests.get(src,timeout=60);r.raise_for_status()
                  out=Path('refined',number+'.mp3');out.write_bytes(r.content)
                  a=av.open(str(out));duration=a.duration/av.time_base;decoded=sum(1 for frame in a.decode(audio=0))
                  assert duration>5 and decoded>20
                  records.append({'file':out.name,'duration':duration,'sha256':hashlib.sha256(r.content).hexdigest(),'bytes':len(r.content),'decoded_frames':decoded})
                  page.close()
              browser.close()
          Path('refined/retrieval_refined.json').write_text(json.dumps(records,indent=2))
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(Path('refined').glob('*.mp3')):
              segments,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              d={'file':p.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segments]}
              p.with_suffix('.json').write_text(json.dumps(d,ensure_ascii=False,indent=2));print(p.name,[s['text'] for s in d['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astrophage-refined-voice
          path: refined/
          retention-days: 1
