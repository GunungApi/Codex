name: PHYS021 final narration readings
on:
  push:
    paths: ['.github/workflows/phys021_energy_voice_20261005.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover commissioned replacement sentences
        run: |
          python -m pip -q install playwright requests av faster-whisper
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p final
          python - <<'PY'
          from pathlib import Path
          import requests,json,urllib.parse,hashlib,av
          from playwright.sync_api import sync_playwright
          from faster_whisper import WhisperModel
          ids={'02':'0246f8a65a974d85a291dfc6cffdb153','04':'a5405ee5c02b4a48b12fb58d207a96e8'};records=[]
          with sync_playwright() as pw:
              b=pw.chromium.launch(headless=True)
              for n,cid in ids.items():
                  p=b.new_page();p.goto('https://www.aidocmaker.com/g0/audio?name='+cid,wait_until='domcontentloaded',timeout=90000)
                  src=[]
                  for attempt in range(65):
                      src=p.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                      if src:break
                      p.wait_for_timeout(1000)
                  assert src;u=urllib.parse.urlparse(src[0]);assert u.scheme=='https' and u.netloc=='storage.googleapis.com'
                  print('::add-mask::'+src[0]);r=requests.get(src[0],timeout=60);r.raise_for_status();f=Path('final',n+'.mp3');f.write_bytes(r.content)
                  a=av.open(str(f));duration=a.duration/av.time_base;decoded=sum(1 for x in a.decode(audio=0));assert 2<duration<30 and decoded>10
                  records.append({'file':f.name,'duration':duration,'sha256':hashlib.sha256(r.content).hexdigest(),'bytes':len(r.content),'decoded_frames':decoded});p.close()
              b.close()
          Path('final/retrieval.json').write_text(json.dumps(records,indent=2))
          m=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          for f in sorted(Path('final').glob('*.mp3')):
              seg,info=m.transcribe(str(f),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              d={'file':f.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in seg]}
              f.with_name(f.stem+'_words.json').write_text(json.dumps(d,ensure_ascii=False,indent=2));print(f.name,[s['text'] for s in d['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phys021-final-readings
          path: final/
          retention-days: 7
