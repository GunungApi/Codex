name: PHYS001 media acquisition test
on:
  push:
    paths: ['.github/workflows/phys001_media_test_20260928.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare licensed tools and rendering wheels
        run: |
          python -m pip -q install playwright requests av faster-whisper
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p media/raw media/wheels
          python -m pip download --only-binary=:all: --python-version 3.13 --implementation cp --abi cp313 --platform manylinux2014_x86_64 -d media/wheels moderngl glcontext
      - name: Retrieve commissioned narration and word timing
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests,json,urllib.parse,hashlib,av
          from playwright.sync_api import sync_playwright
          from faster_whisper import WhisperModel
          # Durable playback identifier, not a temporary signed media URL.
          cid='78d9c83fbd7741289b0e28a151ef5519'
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              page=browser.new_page()
              page.goto('https://www.aidocmaker.com/g0/audio?name='+cid,wait_until='domcontentloaded',timeout=90000)
              sources=[]
              for attempt in range(75):
                  sources=page.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                  if sources:break
                  page.wait_for_timeout(1000)
              assert sources,'No playable audio source'
              src=sources[0];u=urllib.parse.urlparse(src)
              assert u.scheme=='https' and u.netloc=='storage.googleapis.com'
              print('::add-mask::'+src)
              r=requests.get(src,timeout=60);r.raise_for_status()
              p=Path('media/raw/01.mp3');p.write_bytes(r.content)
              a=av.open(str(p));duration=a.duration/av.time_base;decoded=sum(1 for f in a.decode(audio=0))
              assert 3<duration<30 and decoded>10
              browser.close()
          Path('media/retrieval_test.json').write_text(json.dumps({'file':'01.mp3','duration':duration,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'decoded_frames':decoded},indent=2))
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          segments,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
          data={'file':p.name,'model':'large-v3-turbo','duration':info.duration,'segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segments]}
          Path('media/raw/01_words.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          print('Duration:',duration,'Transcription:',[s['text'] for s in data['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phys001-media-test
          path: media/
          retention-days: 1
