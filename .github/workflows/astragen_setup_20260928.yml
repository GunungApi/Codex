name: Astragen temporary production setup
on:
  push:
    paths: ['.github/workflows/astragen_setup_20260928.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Obtain rendering dependencies
        run: |
          mkdir -p wheels transfer
          python -m pip download --only-binary=:all: --dest wheels moderngl==5.12.0 glcontext==3.0.0
          python -m pip install cryptography
          python - <<'PY'
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          from pathlib import Path
          k=rsa.generate_private_key(public_exponent=65537,key_size=3072)
          Path('transfer/key.pem').write_bytes(k.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()))
          Path('transfer/public.pem').write_bytes(k.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astragen-render-wheels
          path: wheels/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: astragen-transfer-key
          path: transfer/
          retention-days: 1
