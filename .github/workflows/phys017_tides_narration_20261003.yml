name: PHYS017 reading refinement
on:
  push:
    paths: ['.github/workflows/phys017_tides_narration_20261003.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve replacement sentence
        run: |
          python -m pip -q install playwright requests faster-whisper
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p refined
          python - <<'PY'
          from pathlib import Path
          import requests,json,urllib.parse,hashlib
          from playwright.sync_api import sync_playwright
          from faster_whisper import WhisperModel
          with sync_playwright() as pw:
              b=pw.chromium.launch(headless=True);p=b.new_page()
              p.goto('https://www.aidocmaker.com/g0/audio?name=a90fd98816404a8a9da24c2b103407d3',wait_until='domcontentloaded',timeout=90000)
              sources=[]
              for n in range(65):
                  sources=p.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                  if sources:break
                  p.wait_for_timeout(1000)
              assert sources
              u=urllib.parse.urlparse(sources[0]);assert u.scheme=='https' and u.netloc=='storage.googleapis.com'
              print('::add-mask::'+sources[0]);r=requests.get(sources[0],timeout=60);r.raise_for_status()
              f=Path('refined/02.mp3');f.write_bytes(r.content);b.close()
          m=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          seg,info=m.transcribe(str(f),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
          d={'file':f.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in seg]}
          Path('refined/02_words.json').write_text(json.dumps(d,ensure_ascii=False,indent=2))
          Path('refined/retrieval.json').write_text(json.dumps({'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'bytes':f.stat().st_size,'duration':info.duration},indent=2))
          print([s['text'] for s in d['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phys017-refined-02
          path: refined/
          retention-days: 2
