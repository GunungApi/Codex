name: P004 revised opening narration
on:
  push:
    paths: ['.github/workflows/p004-voice-corrected-20260920.yml']
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cryptography requests faster-whisper
      - name: Secure audio recovery
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,base64,time,pathlib,requests,av
          from cryptography.hazmat.primitives.asymmetric import rsa,padding
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          key=rsa.generate_private_key(public_exponent=65537,key_size=3072)
          pub=key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo)
          api='https://api.github.com/repos/'+os.environ['REPO']+'/contents/'
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          r=requests.put(api+'.production/p004-20260920c-public.pem',headers=h,json={'message':'Publish ephemeral relay public key','content':base64.b64encode(pub).decode()},timeout=30);r.raise_for_status()
          print('Public key ready. Private key stays only in memory.',flush=True)
          payload=None
          for attempt in range(120):
              r=requests.get(api+'.production/p004-20260920c-payload.json',headers=h,timeout=30)
              if r.status_code==200:
                  payload=json.loads(base64.b64decode(r.json()['content']));break
              time.sleep(5)
          if payload is None: raise RuntimeError('Encrypted input not received')
          aes=key.decrypt(base64.b64decode(payload['key']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          data=json.loads(AESGCM(aes).decrypt(base64.b64decode(payload['nonce']),base64.b64decode(payload['data']),b'p004-20260920'))
          from urllib.parse import urlparse
          pathlib.Path('voice').mkdir(exist_ok=True);report=[]
          for i,url in enumerate(data['urls'],1):
              assert urlparse(url).scheme=='https' and urlparse(url).hostname=='storage.googleapis.com'
              assert urlparse(url).path.startswith('/adm--audio-playback--7d--public/mcp-preview/')
              r=requests.get(url,timeout=90);r.raise_for_status()
              p=pathlib.Path('voice')/f'{i:02}.mp3';p.write_bytes(r.content)
              with av.open(str(p)) as c:
                  frames=list(c.decode(audio=0));dur=sum(f.samples/f.sample_rate for f in frames)
              report.append({'segment':i,'bytes':len(r.content),'decoded_duration':dur})
          pathlib.Path('voice/acquisition.json').write_text(json.dumps(report,indent=2))
          print('Audio verified:',report,flush=True)
          PY
      - name: Align words
        run: |
          python - <<'PY'
          import pathlib,json
          from faster_whisper import WhisperModel
          m=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(pathlib.Path('voice').glob('*.mp3')):
              segs,info=m.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=True,initial_prompt='宇宙。原子。クォーク。グルーオン。陽子。中性子。原子核。粒子。')
              out=[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in (s.words or [])]} for s in segs]
              p.with_suffix('.words.json').write_text(json.dumps(out,ensure_ascii=False,indent=2));print(p.name,[s['text'] for s in out],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p004-opening-revised
          path: voice/
          retention-days: 1
