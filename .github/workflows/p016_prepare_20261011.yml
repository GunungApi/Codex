name: P016 protected production setup
on:
  push:
    paths: ['.github/workflows/p016_prepare_20261011.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare transfer and renderer
        run: |
          mkdir -p private wheels
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out private/key.pem 2>/dev/null
          openssl pkey -in private/key.pem -pubout -out public.pem
          cat public.pem
          python -m pip download --only-binary=:all: -d wheels moderngl glcontext
      - uses: actions/upload-artifact@v4
        with:
          name: p016-transfer-key
          path: private/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: p016-renderer-wheels
          path: wheels/
          retention-days: 2
