name: VAH existing narration recovery
on:
  push:
    paths: ['.github/workflows/vah-audio-20260920.yml']
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cryptography requests faster-whisper
      - name: Recover already generated audio securely
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,base64,time,pathlib,requests,av,hashlib
          from urllib.parse import urlparse
          from cryptography.hazmat.primitives.asymmetric import rsa,padding
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          key=rsa.generate_private_key(public_exponent=65537,key_size=3072)
          pub=key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo)
          api='https://api.github.com/repos/'+os.environ['REPO']+'/contents/'
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          public_path='.production/vah-20260920-public.pem'
          input_path='.production/vah-20260920-payload.json'
          r=requests.put(api+public_path,headers=h,json={'message':'Publish ephemeral production public key','content':base64.b64encode(pub).decode()},timeout=30);r.raise_for_status()
          print('Ephemeral public key ready; private key remains in memory.',flush=True)
          payload=None
          for attempt in range(120):
              r=requests.get(api+input_path,headers=h,timeout=30)
              if r.status_code==200:
                  payload=json.loads(base64.b64decode(r.json()['content']));break
              time.sleep(5)
          if payload is None: raise RuntimeError('No encrypted input')
          aes=key.decrypt(base64.b64decode(payload['key']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          data=json.loads(AESGCM(aes).decrypt(base64.b64decode(payload['nonce']),base64.b64decode(payload['data']),b'vah-20260920'))
          pathlib.Path('voice').mkdir(exist_ok=True);report=[]
          for i,url in enumerate(data['urls'],1):
              assert urlparse(url).scheme=='https' and urlparse(url).hostname=='storage.googleapis.com'
              assert urlparse(url).path.startswith('/adm--audio-playback--7d--public/mcp-preview/')
              r=requests.get(url,timeout=90);r.raise_for_status()
              p=pathlib.Path('voice')/f'{i:02}.mp3';p.write_bytes(r.content)
              with av.open(str(p)) as c:
                  frames=list(c.decode(audio=0));dur=sum(f.samples/f.sample_rate for f in frames)
              report.append({'segment':i,'bytes':len(r.content),'decoded_duration':dur,'sha256':hashlib.sha256(r.content).hexdigest()})
          pathlib.Path('voice/acquisition.json').write_text(json.dumps(report,indent=2))
          print('Audio decoded successfully:',report,flush=True)
          for path in (input_path,public_path):
              q=requests.get(api+path,headers=h,timeout=30)
              if q.status_code==200:
                  requests.delete(api+path,headers=h,json={'message':'Remove completed temporary relay material','sha':q.json()['sha']},timeout=30).raise_for_status()
          PY
      - name: Align Japanese narration
        run: |
          python - <<'PY'
          import pathlib,json
          from faster_whisper import WhisperModel
          m=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(pathlib.Path('voice').glob('*.mp3')):
              segs,info=m.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=True,initial_prompt='オリオン腕。真空適応人類。ディープスペーサー。エナメル質。鱗。皮膚。圧力服。柔らかな膜。酸素。血液。組織。一時間。船体。')
              out=[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in (s.words or [])]} for s in segs]
              p.with_suffix('.words.json').write_text(json.dumps(out,ensure_ascii=False,indent=2));print(p.name,[s['text'] for s in out],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vah-recovered-narration
          path: voice/
          retention-days: 1
