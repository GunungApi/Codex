name: MUUH002 v3 browser playback recovery
on:
  push:
    paths: ['.github/workflows/muuh002_v3_playback_browser_20260922.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public browser tools
        run: |
          python -m pip install playwright requests
          python -m playwright install --with-deps chromium
      - name: Open only the already generated public voiceover pages
        run: |
          python - <<'PY'
          import pathlib,json,re,urllib.parse,requests
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('recovered');out.mkdir()
          items={'intro':'0c8c2ac4b8a2404dae2ff11f9943a9db','earth_structure':'ed930b3099394989a3bf91e3d4e0a205','muscle_compare':'131eb967c04c4a90ac4773437161fcf8','earth_nerve':'0545ccd3b2f344d08aa753fa3c3d9d1d'}
          report=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for name,cid in items.items():
                  page=browser.new_page();responses=[];captured=[]
                  def receive(r):
                      try:
                          u=urllib.parse.urlparse(r.url);ct=r.headers.get('content-type','')
                          if u.hostname and (u.hostname.endswith('aidocmaker.com') or u.hostname=='storage.googleapis.com'):
                              rec={'host':u.hostname,'path':u.path,'type':ct,'status':r.status}
                              if 'audio/' in ct:
                                  data=r.body()
                                  if 5000<len(data)<10000000:
                                      (out/(name+'.mp3')).write_bytes(data);captured.append(len(data))
                              elif 'json' in ct:
                                  rec['body']=r.text()[:80000]
                              responses.append(rec)
                      except Exception as ex:responses.append({'error':type(ex).__name__})
                  page.on('response',receive)
                  page.goto('https://www.aidocmaker.com/g0/audio?name='+cid,wait_until='networkidle',timeout=60000)
                  page.wait_for_timeout(5000)
                  sources=page.locator('audio,video,source').evaluate_all('(els)=>els.map(e=>e.currentSrc||e.src).filter(Boolean)')
                  for url in sources:
                      u=urllib.parse.urlparse(url)
                      if u.scheme=='https' and (u.hostname=='storage.googleapis.com' or u.hostname.endswith('aidocmaker.com')):
                          data=page.request.get(url).body()
                          if 5000<len(data)<10000000:(out/(name+'.mp3')).write_bytes(data);captured.append(len(data))
                  (out/(name+'_body.txt')).write_text(page.locator('body').inner_text())
                  (out/(name+'_network.json')).write_text(json.dumps(responses,ensure_ascii=False,indent=2))
                  page.screenshot(path=str(out/(name+'_page.png')))
                  report.append({'name':name,'captured_bytes':captured,'media_elements':len(sources)})
                  page.close()
              browser.close()
          (out/'report.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: muuh002-v3-playback-audio
          path: recovered/
          retention-days: 2
          if-no-files-found: error
      - name: Align recovered Japanese narration
        run: |
          python -m pip install faster-whisper
          python - <<'PY'
          from pathlib import Path
          import json
          paths=list(Path('recovered').glob('*.mp3'))
          if not paths:raise SystemExit('No audio recovered; do not substitute a different voice')
          from faster_whisper import WhisperModel
          model=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          out=Path('aligned');out.mkdir()
          for p in paths:
              segments,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              result={'duration':info.duration,'segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segments]}
              (out/(p.stem+'.json')).write_text(json.dumps(result,ensure_ascii=False,indent=2))
              print(p.name,[(s['start'],s['end'],s['text']) for s in result['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: muuh002-v3-word-times
          path: aligned/
          retention-days: 2
          if-no-files-found: error
