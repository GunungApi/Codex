name: Fetch P002 voice
on:
  push:
    paths:
      - '.github/workflows/fetch_p002_voice.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch generated voice previews
        run: |
          mkdir -p voice
          curl -fL --retry 3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/b938198a-a752-4d12-930c-fd249625976f.mp3' -o voice/01.mp3
          curl -fL --retry 3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/ebe8259c-5af1-4add-b2e2-eec92b6d8e94.mp3' -o voice/02.mp3
          curl -fL --retry 3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/375d8574-5957-4de2-bcfe-ca9170b5bf50.mp3' -o voice/03.mp3
          file voice/*
      - uses: actions/upload-artifact@v4
        with:
          name: p002-voice-parts
          path: voice/
