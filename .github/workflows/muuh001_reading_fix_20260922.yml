name: MUUH001 reading refinement
on:
  push:
    paths: ['.github/workflows/muuh001_reading_fix_20260922.yml']
permissions:
  contents: read
  actions: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: muuh001-private-transfer-key
          path: private
          run-id: 35645459677
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Retrieve and align corrected voice
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python -m pip install cryptography faster-whisper
          python - <<'PY'
          import pathlib,base64,json,urllib.request,hashlib
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          d={"key":"","nonce":"QnsHcDNtwFsA2Nz5","data":""}
          pk=serialization.load_pem_private_key(pathlib.Path('private/key.pem').read_bytes(),password=None)
          k=pk.decrypt(base64.b64decode(d['key']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          urls=json.loads(AESGCM(k).decrypt(base64.b64decode(d['nonce']),base64.b64decode(d['data']),None))
          out=pathlib.Path('out');out.mkdir()
          for n,url in enumerate(urls,1):
              print('::add-mask::'+url,flush=True)
              try:
                  with urllib.request.urlopen(url,timeout=60) as r:data=r.read()
              except Exception:raise RuntimeError('Audio retrieval failed') from None
              (out/f'{n:02d}.mp3').write_bytes(data)
          pathlib.Path('private/key.pem').unlink()
          from faster_whisper import WhisperModel
          m=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          checks={}
          for n in range(1,6):
              p=out/f'{n:02d}.mp3';s,info=m.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              rows=[{'start':x.start,'end':x.end,'text':x.text,'words':[{'word':w.word,'start':w.start,'end':w.end,'probability':w.probability} for w in x.words]} for x in s]
              (out/f'{n:02d}.json').write_text(json.dumps({'duration':info.duration,'segments':rows},ensure_ascii=False,indent=2))
              checks[p.name]={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size}
              print(n,info.duration,' '.join(x['text'] for x in rows),flush=True)
          (out/'checksums.json').write_text(json.dumps(checks,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muuh001-corrected-voice
          path: out/
          retention-days: 1
          if-no-files-found: error
