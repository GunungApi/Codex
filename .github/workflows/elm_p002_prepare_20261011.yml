name: ELM P002 protected preparation
on:
  push:
    paths: ['.github/workflows/elm_p002_prepare_20261011.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare transfer key and matching rendering wheels
        run: |
          mkdir -p private wheels
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out private/key.pem 2>/dev/null
          openssl pkey -in private/key.pem -pubout -out private/public.pem
          cat private/public.pem
          python -m pip download --only-binary=:all: moderngl glcontext -d wheels
      - uses: actions/upload-artifact@v4
        with:
          name: elm-p002-protected-key
          path: private/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: elm-p002-render-wheels
          path: wheels/
          retention-days: 1
