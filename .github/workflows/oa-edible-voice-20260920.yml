name: OA edible table narration 20260920
on:
  push:
    paths:
      - '.github/workflows/oa-edible-voice-20260920.yml'
permissions:
  contents: read
  actions: read
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: oa-edible-bootstrap-private
          run-id: 35458662360
          github-token: ${{ github.token }}
          path: bootstrap
      - name: Install speech alignment dependencies
        run: python -m pip install -q cryptography requests faster-whisper
      - name: Recover and validate narration without logging source URLs
        run: |
          mkdir -p narration/source
          python - <<'PY'
          import base64,json,pathlib,requests,subprocess,hashlib
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          blob=base64.b64decode('')
          key=pathlib.Path('bootstrap/transfer.key').read_bytes()
          urls=json.loads(AESGCM(key).decrypt(blob[:12],blob[12:],b'edible-table-v1'))
          manifest=[]
          for i,url in enumerate(urls,1):
              print('::add-mask::'+url)
              try:
                  r=requests.get(url,timeout=90); r.raise_for_status()
              except Exception:
                  raise RuntimeError('Narration transfer failed for clip '+str(i)) from None
              p=pathlib.Path(f'narration/source/{i:02d}.mp3'); p.write_bytes(r.content)
              subprocess.run(['ffmpeg','-v','error','-i',str(p),'-f','null','-'],check=True)
              if i==1:
                  subprocess.run(['ffmpeg','-v','error','-f','lavfi','-i','color=c=black:s=108x192:r=24:d=1','-i',str(p),'-t','1','-c:v','libx264','-c:a','aac','-y','narration/recovery_mux_test.mp4'],check=True)
              info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(p)]))
              manifest.append({'clip':i,'sha256':hashlib.sha256(r.content).hexdigest(),'probe':info})
          pathlib.Path('narration/recovery_validation.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Japanese word alignment
        env:
          OMP_NUM_THREADS: '4'
        run: |
          python - <<'PY'
          import pathlib,json
          from faster_whisper import WhisperModel
          model=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4,num_workers=1)
          out=[]
          for p in sorted(pathlib.Path('narration/source').glob('*.mp3')):
              segments,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False,initial_prompt='オリオン腕。食べられるテーブル。食用の形を制御できる素材。再資源化設備。歯とあごの強化。')
              segs=[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in (s.words or [])]} for s in segments]
              out.append({'file':p.name,'duration':info.duration,'segments':segs})
              print(p.name,info.duration,' '.join(s['text'] for s in segs))
          pathlib.Path('narration/transcription_words.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: oa-edible-narration-v1
          path: narration/
          retention-days: 1
          if-no-files-found: error
