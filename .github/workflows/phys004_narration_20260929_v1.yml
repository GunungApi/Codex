name: PHYS004 playback diagnosis and recovery
on:
  push:
    paths: ['.github/workflows/phys004_narration_20260929_v1.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect authorized playback and recover available audio
        run: |
          mkdir -p narration/diagnostics
          python -m pip -q install playwright requests av faster-whisper
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          python - <<'PY'
          from pathlib import Path
          import requests,json,urllib.parse,hashlib,av
          from playwright.sync_api import sync_playwright
          pages={'01':'63b619c6323245048b9f6dd84eadd2af','02':'f51094e4b23c417b9c5c774010c775cf','03':'cedb4744b7264a02b767d919695e49bf','04':'c66f081eaae24fc7bcd06f8d0c9612ca','05':'2c37dcd2673546929df680279fbbe0a0','06':'63399fd9db6147d1a6ece92e496f31bf'}
          records=[]
          def safe_url(s):
              u=urllib.parse.urlparse(s);return u.scheme+'://'+u.netloc+u.path
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              for number,cid in pages.items():
                  page=browser.new_page();media=[];responses=[]
                  def response(r):
                      u=urllib.parse.urlparse(r.url);ct=r.headers.get('content-type','')
                      if u.netloc=='storage.googleapis.com' and ('audio' in ct or u.path.endswith('.mp3')):
                          print('::add-mask::'+r.url);media.append(r.url)
                      if r.status>=400:responses.append({'url':safe_url(r.url),'status':r.status})
                  page.on('response',response)
                  nav=page.goto('https://www.aidocmaker.com/g0/audio?name='+cid,wait_until='domcontentloaded',timeout=90000)
                  page.wait_for_timeout(12000)
                  sources=page.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                  buttons=page.locator('button').all_text_contents()
                  if not sources and not media:
                      play=page.get_by_role('button',name='Play',exact=True)
                      if play.count()==1:play.click()
                      page.wait_for_timeout(18000)
                      sources=page.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                  candidates=[x for x in sources+media if urllib.parse.urlparse(x).scheme=='https' and urllib.parse.urlparse(x).netloc=='storage.googleapis.com']
                  if not candidates:
                      d={'file':number,'status':nav.status if nav else None,'title':page.title(),'location':safe_url(page.url),'body':page.locator('body').inner_text()[:12000],'buttons':buttons,'iframes':[safe_url(f.url) for f in page.frames],'error_responses':responses}
                      Path('narration/diagnostics/'+number+'.json').write_text(json.dumps(d,ensure_ascii=False,indent=2))
                      page.screenshot(path='narration/diagnostics/'+number+'.png',full_page=True)
                      print('No playable source; diagnosis captured:',number,d['title'],d['status']);break
                  src=candidates[0];print('::add-mask::'+src)
                  r=requests.get(src,timeout=60);r.raise_for_status();p=Path('narration',number+'.mp3');p.write_bytes(r.content)
                  a=av.open(str(p));duration=a.duration/av.time_base;decoded=sum(1 for f in a.decode(audio=0))
                  assert 2<duration<30 and decoded>10
                  records.append({'file':p.name,'context_id':cid,'duration':duration,'sha256':hashlib.sha256(r.content).hexdigest(),'bytes':len(r.content),'decoded_frames':decoded})
                  page.close()
              browser.close()
          Path('narration/retrieval.json').write_text(json.dumps(records,indent=2))
          if records:
              from faster_whisper import WhisperModel
              model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
              for p in sorted(Path('narration').glob('*.mp3')):
                  segments,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
                  d={'file':p.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segments]}
                  p.with_name(p.stem+'_words.json').write_text(json.dumps(d,ensure_ascii=False,indent=2));print(p.name,info.duration,[s['text'] for s in d['segments']])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phys004-playback-diagnosis-v1
          path: narration/
          retention-days: 1
