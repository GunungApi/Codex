name: Starlifting temporary artifact cleanup
on:
  push:
    paths:
      - '.github/workflows/starlifting-production-20260920.yml'
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete only this task's known temporary recovery artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p report
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          expected={10606546272:'starlifting-envelope-key',10606336569:'starlifting-renderer-bootstrap',10606029015:'starlifting-audio-aligned',10605964335:'starlifting-original-audio',10606014951:'starlifting-large-word-verification',10606882316:'starlifting-repaired-verified-audio'}
          rows=[]
          for ident,name in expected.items():
              endpoint=f'repos/GunungApi/Codex/actions/artifacts/{ident}'
              result=subprocess.run(['gh','api',endpoint],capture_output=True,text=True,check=True)
              meta=json.loads(result.stdout)
              assert meta['name']==name and name.startswith('starlifting-')
              subprocess.run(['gh','api','--method','DELETE',endpoint],capture_output=True,text=True,check=True)
              rows.append({'id':ident,'name':name,'deleted':True})
          Path('report/temporary_cleanup.json').write_text(json.dumps(rows,indent=2))
          print('Removed the six verified temporary artifacts for this task only.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: starlifting-cleanup-report
          path: report/
          retention-days: 1
