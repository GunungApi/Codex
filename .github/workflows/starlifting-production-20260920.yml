name: Starlifting narration verification
on:
  push:
    paths:
      - '.github/workflows/starlifting-production-20260920.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: starlifting-audio-aligned
          run-id: 35514743046
          github-token: ${{ github.token }}
          path: audio
      - run: pip install faster-whisper
      - name: Verify speech with a larger Japanese-capable model
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel
          m=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          data=[]
          for p in sorted(Path('audio/source').glob('*.mp3')):
              segs,info=m.transcribe(str(p),language='ja',beam_size=5,word_timestamps=True,vad_filter=False,initial_prompt='スターリフティング。光で加熱し、磁場で導く。恒星、表層、外層、プラズマ、電子、原子核、水素、ヘリウム、極、磁気ノズル、回収設備。集める、加熱する、導く、回収する。遠未来の資源工場。')
              rows=[]
              for s in segs:
                  rows.append({'start':s.start,'end':s.end,'text':s.text,'words':[{'word':w.word,'start':w.start,'end':w.end,'probability':w.probability} for w in s.words]})
              data.append({'file':p.name,'segments':rows})
          Path('verification').mkdir(exist_ok=True)
          Path('verification/transcription_large_words.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: starlifting-large-word-verification
          path: verification/
          retention-days: 1
