name: Starlifting production recovery
on:
  push:
    paths:
      - '.github/workflows/starlifting-production-20260920.yml'
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: starlifting-envelope-key
          run-id: 35514437727
          github-token: ${{ github.token }}
          path: key
      - name: Install audio readers
        run: pip install cryptography requests faster-whisper
      - name: Retrieve the eight narration clips generated for this video
        run: |
          python - <<'PY'
          # The envelope protects temporary voice links from public source history.
          # It contains only eight AI Doc Maker preview MP3 URLs, generated in this chat.
          # This step has no GitHub write token and changes no remote account data.
          import base64,json,hashlib,requests,av
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          e=json.loads('''{"key":"","nonce":"qZ+SnN5PGCiUCpZT","data":""}''')
          dec=base64.b64decode
          keypath=Path('key/private.pem')
          k=serialization.load_pem_private_key(keypath.read_bytes(),password=None)
          aes=k.decrypt(dec(e['key']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          urls=json.loads(AESGCM(aes).decrypt(dec(e['nonce']),dec(e['data']),None))
          assert len(urls)==8
          Path('out/source').mkdir(parents=True,exist_ok=True)
          Path('out/checks').mkdir(exist_ok=True)
          rows=[]
          for i,u in enumerate(urls,1):
              assert u.startswith('https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/') and u.endswith('.mp3')
              r=requests.get(u,timeout=90,allow_redirects=False)
              if r.status_code!=200: raise RuntimeError('Segment recovery failed: '+str(i))
              p=Path(f'out/source/{i:02}.mp3');p.write_bytes(r.content)
              with av.open(str(p)) as c:
                  frames=list(c.decode(audio=0));samples=sum(f.samples for f in frames);sr=frames[0].sample_rate
              assert samples>sr*2
              rows.append({'file':p.name,'seconds':samples/sr,'sample_rate':sr,'sha256':hashlib.sha256(r.content).hexdigest()})
          Path('out/checks/recovery.json').write_text(json.dumps(rows,indent=2))
          keypath.unlink()
          print('Recovered and decoded eight narration segments.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: starlifting-original-audio
          path: out/
          retention-days: 1
      - name: Generate Japanese speech timestamps
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel
          m=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          data=[]
          for p in sorted(Path('out/source').glob('*.mp3')):
              segs,info=m.transcribe(str(p),language='ja',beam_size=5,word_timestamps=True,vad_filter=False,initial_prompt='スターリフティング。恒星、表層、外層、プラズマ、電子、原子核、水素、ヘリウム、磁場、極、磁気ノズル、回収設備。')
              rows=[]
              for s in segs:
                  rows.append({'start':s.start,'end':s.end,'text':s.text,'words':[{'word':w.word,'start':w.start,'end':w.end,'probability':w.probability} for w in s.words]})
              data.append({'file':p.name,'segments':rows})
          Path('out/checks/transcription_words.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: starlifting-audio-aligned
          path: out/
          retention-days: 1
