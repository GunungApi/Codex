name: P005 narration verification
on:
  push:
    branches: [p005-assets-20260920]
    paths: [.github/workflows/p005-align.yml]
permissions:
  contents: read
  actions: read
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: p005-original-voice
          run-id: 35482799350
          github-token: ${{ github.token }}
          path: voice_assets
      - name: Independent Japanese recognition
        run: |
          python -m pip -q install faster-whisper
          python - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel
          p=Path('voice_assets')
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          result=[]
          for e in json.loads((p/'scripts.json').read_text()):
              segs,info=model.transcribe(str(p/'voice'/e['file']),language='ja',word_timestamps=True,beam_size=5,condition_on_previous_text=False,initial_prompt=None,vad_filter=False)
              record={**e,'segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segs]}
              result.append(record)
              print(e['file'], ''.join(s['text'] for s in record['segments']),flush=True)
          Path('independent_transcription.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p005-independent-alignment
          path: independent_transcription.json
          retention-days: 1
