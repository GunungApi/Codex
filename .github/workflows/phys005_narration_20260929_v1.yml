name: PHYS005 narration preparation
on:
  push:
    paths: ['.github/workflows/phys005_narration_20260929_v1.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate one-use transfer key
        run: |
          python -m pip -q install cryptography requests av faster-whisper
          mkdir -p transfer narration
          python - <<'PY'
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          key=rsa.generate_private_key(public_exponent=65537,key_size=2048)
          Path('transfer/private.pem').write_bytes(key.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()))
          Path('transfer/public.pem').write_bytes(key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phys005-transfer-public-key
          path: transfer/public.pem
          retention-days: 1
      - name: Recover commissioned audio and Japanese timestamps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,time,json,base64,hashlib,urllib.parse,requests,av
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from faster_whisper import WhisperModel
          endpoint='https://api.github.com/repos/GunungApi/Codex/contents/phys005_transfer_request_v1.json'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          envelope=None
          for attempt in range(100):
              response=requests.get(endpoint,headers=headers,timeout=25)
              if response.status_code==200:
                  envelope=json.loads(base64.b64decode(response.json()['content']));break
              if response.status_code!=404: raise RuntimeError('Unexpected manifest response '+str(response.status_code))
              time.sleep(5)
          assert envelope,'Transfer manifest not received'
          key=serialization.load_pem_private_key(Path('transfer/private.pem').read_bytes(),password=None)
          secret=key.decrypt(base64.b64decode(envelope['key']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          manifest=json.loads(AESGCM(secret).decrypt(base64.b64decode(envelope['nonce']),base64.b64decode(envelope['payload']),None))
          Path('transfer/private.pem').unlink()
          records=[]
          for number,src in manifest.items():
              assert number in ['01','02','03','04','05','06']
              u=urllib.parse.urlparse(src);assert u.scheme=='https' and u.netloc=='storage.googleapis.com' and '/mcp-preview/' in u.path
              print('::add-mask::'+src)
              response=requests.get(src,timeout=75);response.raise_for_status()
              p=Path('narration',number+'.mp3');p.write_bytes(response.content)
              audio=av.open(str(p));duration=audio.duration/av.time_base;count=sum(1 for frame in audio.decode(audio=0))
              assert 2<duration<30 and count>10
              records.append({'file':p.name,'duration':duration,'bytes':len(response.content),'sha256':hashlib.sha256(response.content).hexdigest(),'decoded_frames':count,'source':'tool-provided full-sentence preview'})
          Path('narration/retrieval.json').write_text(json.dumps(records,indent=2))
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(Path('narration').glob('*.mp3')):
              segments,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              record={'file':p.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segments]}
              p.with_name(p.stem+'_words.json').write_text(json.dumps(record,ensure_ascii=False,indent=2))
              print(p.name,info.duration,[s['text'] for s in record['segments']])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phys005-narration-v1
          path: narration/
          retention-days: 1
