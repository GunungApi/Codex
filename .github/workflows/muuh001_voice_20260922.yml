name: MUUH001 narration recovery and spoken alignment
on:
  push:
    paths: ['.github/workflows/muuh001_voice_20260922.yml']
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: muuh001-private-transfer-key
          path: private
          run-id: 35645459677
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover complete voice segments and align actual audio
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python -m pip install cryptography faster-whisper
          python - <<'PY'
          import pathlib,base64,json,urllib.request,hashlib,time
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          d={"key":"","nonce":"esw8Uj9LQ++ek2f4","data":""}
          private=serialization.load_pem_private_key(pathlib.Path('private/key.pem').read_bytes(),password=None)
          key=private.decrypt(base64.b64decode(d['key']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          urls=json.loads(AESGCM(key).decrypt(base64.b64decode(d['nonce']),base64.b64decode(d['data']),None))
          out=pathlib.Path('out');out.mkdir()
          hashes_out={}
          for n,url in enumerate(urls,1):
              print('::add-mask::'+url,flush=True)
              data=None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(url,timeout=60) as r:data=r.read()
                      break
                  except Exception:
                      time.sleep(3)
              if data is None:raise RuntimeError('Authorized audio retrieval failed for segment '+str(n))
              p=out/f'{n:02d}.mp3';p.write_bytes(data)
              hashes_out[p.name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          pathlib.Path('private/key.pem').unlink()
          (out/'checksums.json').write_text(json.dumps(hashes_out,indent=2))
          from faster_whisper import WhisperModel
          model=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          for n in range(1,6):
              p=out/f'{n:02d}.mp3'
              segments,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              rows=[{'start':s.start,'end':s.end,'text':s.text,'words':[{'word':w.word,'start':w.start,'end':w.end,'probability':w.probability} for w in s.words]} for s in segments]
              (out/f'{n:02d}.json').write_text(json.dumps({'duration':info.duration,'segments':rows},ensure_ascii=False,indent=2))
              print(n,info.duration,' '.join(r['text'] for r in rows),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muuh001-original-voice-alignment
          path: out/
          retention-days: 1
          if-no-files-found: error
