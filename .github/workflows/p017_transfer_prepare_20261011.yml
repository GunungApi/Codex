name: P017 protected voice transfer
on:
  push:
    paths: ['.github/workflows/p017_transfer_prepare_20261011.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Generate protected short-lived transfer key
        run: |
          mkdir -p private
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out private/key.pem 2>/dev/null
          openssl pkey -in private/key.pem -pubout -out public.pem
          cat public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: p017-transfer-key
          path: private/
          retention-days: 1
