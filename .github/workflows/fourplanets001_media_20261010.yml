name: Four planets 001 media preparation
on:
  push:
    paths: ['.github/workflows/fourplanets001_media_20261010.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare public transfer key and rendering wheels
        run: |
          mkdir -p transfer/wheels
          python -m pip download --only-binary=:all: --no-deps moderngl glcontext -d transfer/wheels
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/transfer_private.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/transfer_private.pem" -pubout -out transfer/public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: fourplanets001-public-key-tools
          path: transfer/
          retention-days: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve commissioned audio using encrypted session input
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          python -m pip -q install requests cryptography av faster-whisper
          python - <<'PY'
          import os,time,json,base64,hashlib,urllib.parse
          from pathlib import Path
          import requests,av
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          endpoint='https://api.github.com/repos/GunungApi/Codex/contents/.media-transfer/fourplanets001_20261010.json'
          headers={'Authorization':'Bearer '+os.environ['READ_TOKEN'],'Accept':'application/vnd.github+json'}
          blob=None
          for _ in range(100):
              r=requests.get(endpoint,headers=headers,timeout=30)
              if r.status_code==200:
                  blob=json.loads(base64.b64decode(r.json()['content']));break
              if r.status_code!=404: raise RuntimeError('Transfer input unavailable: '+str(r.status_code))
              time.sleep(8)
          assert blob is not None,'Timed out waiting for encrypted input'
          key=serialization.load_pem_private_key(Path(os.environ['RUNNER_TEMP'],'transfer_private.pem').read_bytes(),password=None)
          session=key.decrypt(base64.b64decode(blob['key']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          payload=json.loads(AESGCM(session).decrypt(base64.b64decode(blob['nonce']),base64.b64decode(blob['data']),b'fourplanets001'))
          out=Path('narration');out.mkdir(exist_ok=True);records=[]
          for item in payload['audio']:
              name=item['name'];src=item['url'];u=urllib.parse.urlparse(src)
              assert name in ['01','02','03','04','05','06']
              assert u.scheme=='https' and u.netloc=='storage.googleapis.com'
              print('::add-mask::'+src)
              response=requests.get(src,timeout=90)
              if response.status_code!=200:raise RuntimeError('Audio transfer status '+str(response.status_code))
              p=out/(name+'.mp3');p.write_bytes(response.content)
              with av.open(str(p)) as media:
                  duration=media.duration/av.time_base;count=sum(1 for f in media.decode(audio=0))
              assert 2<duration<25 and count>10
              records.append({'file':p.name,'duration':duration,'decoded_audio_frames':count,'bytes':len(response.content),'sha256':hashlib.sha256(response.content).hexdigest(),'source':'Commissioned AI Voice Generator excerpt; complete supplied short transcript'})
          (out/'retrieval.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          Path(os.environ['RUNNER_TEMP'],'transfer_private.pem').unlink()
          from faster_whisper import WhisperModel
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(out.glob('*.mp3')):
              segments,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              data={'file':p.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segments]}
              (out/(p.stem+'_words.json')).write_text(json.dumps(data,ensure_ascii=False,indent=2))
              print(p.name,info.duration,[s['text'] for s in data['segments']])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fourplanets001-narration
          path: narration/
          retention-days: 1
      - name: Remove transient private key
        if: always()
        run: rm -f "$RUNNER_TEMP/transfer_private.pem"
