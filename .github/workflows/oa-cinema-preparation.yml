name: OA cinema preparation
on:
  push:
    paths:
      - '.github/workflows/oa-cinema-preparation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare transcription and renderer packages
        run: |
          python -m pip install -q faster-whisper
          mkdir -p output/wheels
          python -m pip download --only-binary=:all: --dest output/wheels moderngl glcontext
      - name: Transcribe original Japanese narration
        shell: python
        run: |
          import os, json, urllib.request
          from faster_whisper import WhisperModel
          ids = ['86abf923-2ea4-4164-a8b9-a5fecd3a1758','53857634-c9cd-41ad-b81b-8acee2621c14','549cf9ea-c497-45bc-b5d7-ceb387a44f01','7abfdff1-8d19-4bec-9d42-9e73ff7a56c8','0988ff76-4718-427a-a995-f2cf00758dd1','793e27d8-4cfc-4af0-a2df-c39f537b3dd1']
          model = WhisperModel('small', device='cpu', compute_type='int8', cpu_threads=4)
          result = []
          for i, uid in enumerate(ids, 1):
              name = f'output/{i:02}.mp3'
              urllib.request.urlretrieve(f'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/{uid}.mp3', name)
              segments, info = model.transcribe(name, language='ja', beam_size=5, word_timestamps=True, initial_prompt='オリオン腕。アルカイ。人工世界。')
              rec = {'file': f'{i:02}.mp3', 'duration': info.duration, 'segments': []}
              for s in segments:
                  rec['segments'].append({'start':s.start,'end':s.end,'text':s.text,'words':[{'word':w.word,'start':w.start,'end':w.end,'probability':w.probability} for w in s.words]})
              result.append(rec)
              print(json.dumps(rec, ensure_ascii=False), flush=True)
          with open('output/transcription.json','w') as f: json.dump(result,f,ensure_ascii=False,indent=2)
      - uses: actions/upload-artifact@v4
        with:
          name: oa-cinema-preparation
          path: output/
          retention-days: 1
