name: P007 voice cross-check
on:
  push:
    branches: [production/p007-20260921]
    paths: [.github/workflows/p007-check-voice.yml]
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: p007-raw-and-render-packages
          run-id: 35519361857
          github-token: ${{ github.token }}
          path: recovered
      - name: Independent Japanese audio recognition
        run: |
          python -m pip install --quiet faster-whisper
          python - <<'PY'
          from faster_whisper import WhisperModel
          import pathlib,json
          model=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          out={}
          for p in sorted(pathlib.Path('recovered').rglob('*.mp3')):
              seg,info=model.transcribe(str(p),language='ja',beam_size=5,word_timestamps=True,condition_on_previous_text=False)
              out[p.name]=[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word} for w in s.words]} for s in seg]
              print(p.name, ''.join(s['text'] for s in out[p.name]),flush=True)
          pathlib.Path('voice_check.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p007-voice-check
          path: voice_check.json
          retention-days: 1
