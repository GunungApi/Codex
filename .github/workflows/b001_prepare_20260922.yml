name: B001 preparation 20260922
on:
  push:
    paths: ['.github/workflows/b001_prepare_20260922.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare local rendering wheels and protected transfer key
        run: |
          mkdir -p out/wheels private
          python -m pip download --only-binary=:all: --no-deps moderngl glcontext -d out/wheels
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out private/key.pem 2>/dev/null
          openssl pkey -in private/key.pem -pubout -out out/public.pem
      - name: Obtain and resample official WMAP data
        run: |
          python -m pip install numpy astropy healpy
          python - <<'PY'
          import urllib.request, pathlib, hashlib, json
          import numpy as np
          import healpy as hp
          from astropy.io import fits
          out=pathlib.Path('out'); (out/'wmap').mkdir()
          url='https://lambda.gsfc.nasa.gov/data/map/dr5/dfp/ilc/wmap_ilc_9yr_v5.fits'
          target=out/'wmap/wmap_ilc_9yr_v5.fits'
          with urllib.request.urlopen(url,timeout=90) as r: target.write_bytes(r.read())
          with fits.open(target) as h:
              header=str(h[1].header)
              data=np.asarray(h[1].data.field(0),dtype=np.float64).flatten()
              unit=h[1].header.get('TUNIT1','unknown')
              ordering=h[1].header.get('ORDERING','NESTED')
          lat=np.linspace(np.pi/2,-np.pi/2,1024)
          lon=np.linspace(-np.pi,np.pi,2048,endpoint=False)
          ll,bb=np.meshgrid(lon,lat)
          image=hp.get_interp_val(data,np.pi/2-bb,ll%(2*np.pi),nest=ordering.upper().strip()=='NESTED')
          np.save(out/'wmap/temperature_latlon.npy',image.astype('float32'))
          (out/'wmap/header.txt').write_text(header)
          meta={'source':url,'unit':unit,'ordering':ordering,'native_nside':hp.npix2nside(len(data)),'projection':'longitude -pi to pi; latitude +pi/2 to -pi/2','interpolation':'HEALPix get_interp_val','fits_sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'min':float(image.min()),'max':float(image.max())}
          (out/'wmap/metadata.json').write_text(json.dumps(meta,indent=2))
          print(meta)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b001-prepared-assets
          path: out/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b001-private-transfer-key
          path: private/
          retention-days: 1
          if-no-files-found: error
