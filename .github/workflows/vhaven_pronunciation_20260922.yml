name: Virtual Haven pronunciation corrections
on:
  push:
    paths: ['.github/workflows/vhaven_pronunciation_20260922.yml']
permissions:
  contents: read
  actions: read
jobs:
  corrected_voice:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: vhaven-transfer-key
          path: private
          run-id: 35710149644
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover corrected synthetic pronunciation clips
        run: |
          python -m pip install cryptography requests faster-whisper
          python - <<'PY'
          import pathlib,base64,uuid,requests,json,av,hashlib
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          key=serialization.load_pem_private_key(pathlib.Path('private/key.pem').read_bytes(),password=None)
          encrypted=''
          ids=key.decrypt(base64.b64decode(encrypted),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode().split('|')
          assert len(ids)==3
          out=pathlib.Path('corrected');out.mkdir()
          for number,item in zip([1,3,4],ids):
              assert str(uuid.UUID(item))==item
              url='https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/'+item+'.mp3'
              print('::add-mask::'+url)
              r=requests.get(url,timeout=45,allow_redirects=False);r.raise_for_status();assert 2000<len(r.content)<10000000
              p=out/f'{number:02}.mp3';p.write_bytes(r.content)
              with av.open(str(p)) as c:
                  frames=list(c.decode(audio=0));assert frames
                  print(number,sum(f.samples for f in frames)/frames[0].sample_rate,hashlib.sha256(r.content).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vhaven-corrected-audio
          path: corrected/
          retention-days: 7
      - name: Check corrected words
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          import pathlib,json
          model=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(pathlib.Path('corrected').glob('*.mp3')):
              segs,info=model.transcribe(str(p),language='ja',beam_size=5,word_timestamps=True,vad_filter=False,condition_on_previous_text=False)
              data=[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in (s.words or [])]} for s in segs]
              p.with_suffix('.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
              print(p.stem,' '.join(s['text'] for s in data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vhaven-corrected-checked
          path: corrected/
          retention-days: 7
