name: P011 audio recovery test
on:
  push:
    paths: ['.github/workflows/p011_audio_test_20260923.yml']
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: p011-transfer-key
          run-id: 35772217272
          github-token: ${{ github.token }}
          path: private
      - name: Decode and verify audio
        env:
          ENCRYPTED_URL: 
        run: |
          mkdir -p recovered
          python - <<'PY'
          import base64,os,subprocess,urllib.request,pathlib
          b=base64.b64decode(os.environ['ENCRYPTED_URL'])
          u=subprocess.check_output(['openssl','pkeyutl','-decrypt','-inkey','private/key.pem','-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],input=b).decode()
          print('::add-mask::'+u)
          with urllib.request.urlopen(u,timeout=45) as r: data=r.read()
          pathlib.Path('recovered/test.mp3').write_bytes(data)
          print('Audio bytes:',len(data))
          PY
          ffmpeg -v error -i recovered/test.mp3 -ar 48000 -ac 1 recovered/test.wav
          ffprobe -v error -show_format -show_streams -of json recovered/test.mp3 > recovered/probe.json
          python -m pip -q install faster-whisper
          python - <<'PY'
          from faster_whisper import WhisperModel
          import json,pathlib
          m=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          seg,info=m.transcribe('recovered/test.mp3',language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
          out=[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in (s.words or [])]} for s in seg]
          pathlib.Path('recovered/transcript.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p011-audio-test
          path: recovered/
          retention-days: 2
          if-no-files-found: error
