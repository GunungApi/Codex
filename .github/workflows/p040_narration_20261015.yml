name: P040 original narration
on:
  push:
    paths: ['.github/workflows/p040_narration_20261015.yml']
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start speech engine
        run: |
          docker run -d --name voicevox -p '127.0.0.1:50021:50021' voicevox/voicevox_engine:cpu-latest
          python -m pip -q install requests faster-whisper
      - name: Create six narration segments
        run: |
          python - <<'PY'
          import requests,json,time,hashlib,wave,subprocess
          from pathlib import Path
          base='http://127.0.0.1:50021'
          for attempt in range(100):
              try:
                  r=requests.get(base+'/speakers',timeout=5)
                  if r.ok:break
              except requests.RequestException:pass
              time.sleep(2)
          r.raise_for_status()
          person=next(s for s in r.json() if s['name']=='四国めたん')
          sid=next(s['id'] for s in person['styles'] if s['name']=='ノーマル')
          texts=['この赤い地面。まだ、足を置けない。溶けた岩石の世界に、どうやって固い大地が生まれるんだろう。','まず、表面から熱が外へ出ていく。冷えてきた一角を、近くで見てみよう。','溶けた岩石の中に、結晶が育つ。結晶どうしがつながると、流れていた場所に、固い部分が広がる。','ここで、地面の下をのぞこう。表面は固まっても、その下には、まだ熱い物質がある。外側と内側は、同時には冷えきらない。','大気が熱を逃がしにくくすると、冷え方もゆっくりに。同じ地面でも、周りの条件が効いてくる。','こうして生まれた、固い外側が地殻。小さな材料から始まった旅が、とうとう大地に届いた。この世界の歴史は、まだ続く。']
          readings=[('地殻','チカク',0),('結晶','ケッショウ',0),('岩石','ガンセキ',0),('表面','ヒョウメン',3),('大気','タイキ',1),('一角','イッカク',0),('外側','ソトガワ',0),('内側','ウチガワ',0),('物質','ブッシツ',0),('材料','ザイリョウ',3),('大地','ダイチ',1)]
          for word,kana,accent in readings:
              requests.post(base+'/user_dict_word',params=dict(surface=word,pronunciation=kana,accent_type=accent,priority=8),timeout=20).raise_for_status()
          root=Path('narration');root.mkdir(exist_ok=True);records=[]
          for i,text in enumerate(texts,1):
              r=requests.post(base+'/audio_query',params=dict(text=text,speaker=sid),timeout=60);r.raise_for_status();q=r.json()
              q.update(speedScale=1.01,pitchScale=-0.015,intonationScale=1.08,volumeScale=1.0,prePhonemeLength=0.15,postPhonemeLength=0.25,outputSamplingRate=48000,outputStereo=False)
              r=requests.post(base+'/synthesis',params=dict(speaker=sid),json=q,timeout=120);r.raise_for_status();p=root/f'{i:02d}.wav';p.write_bytes(r.content)
              with wave.open(str(p),'rb') as f:
                  frames=f.getnframes();rate=f.getframerate();assert rate==48000 and f.getnchannels()==1;assert len(f.readframes(frames))==frames*f.getsampwidth()
              (root/f'{i:02d}_query.json').write_text(json.dumps(q,ensure_ascii=False,indent=2))
              records.append(dict(file=p.name,text=text,duration=frames/rate,samples=frames,sha256=hashlib.sha256(r.content).hexdigest(),kana=q.get('kana')))
              print(p.name,frames/rate,q.get('kana'),flush=True)
          (root/'retrieval.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          (root/'voice.json').write_text(json.dumps(dict(engine='VOICEVOX',engine_version=requests.get(base+'/version').json(),speaker=person,selected_style_id=sid,credit='VOICEVOX:四国めたん',readings=readings),ensure_ascii=False,indent=2))
          (root/'engine_image_digest.txt').write_text(subprocess.check_output(['docker','inspect','--format={{.Image}}','voicevox'],text=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p040-original-narration
          path: narration/
          retention-days: 3
      - name: Independent word timing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(Path('narration').glob('*.wav')):
              segments,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              result=dict(file=p.name,duration=info.duration,model='large-v3-turbo',segments=[dict(start=s.start,end=s.end,text=s.text,words=[dict(start=w.start,end=w.end,word=w.word,probability=w.probability) for w in s.words]) for s in segments])
              (p.parent/f'{p.stem}_words.json').write_text(json.dumps(result,ensure_ascii=False,indent=2));print(p.name,[s['text'] for s in result['segments']],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p040-narration-with-timings
          path: narration/
          retention-days: 3
