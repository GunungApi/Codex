name: B001 pronunciation refinement
on:
  push:
    paths: ['.github/workflows/b001_pronunciation_20260922.yml']
permissions:
  contents: read
  actions: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: b001-private-transfer-key
          path: private
          run-id: 35629230020
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover and align revised narration
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python -m pip install cryptography faster-whisper
          python - <<'PY'
          import pathlib,base64,urllib.request,json,hashlib
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          key=serialization.load_pem_private_key(pathlib.Path('private/key.pem').read_bytes(),password=None)
          enc=''
          url=key.decrypt(base64.b64decode(enc),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode()
          print('::add-mask::'+url,flush=True)
          out=pathlib.Path('out');out.mkdir()
          try:
              with urllib.request.urlopen(url,timeout=60) as r:data=r.read()
          except Exception:raise RuntimeError('Authorized audio retrieval failed') from None
          p=out/'06.mp3';p.write_bytes(data);pathlib.Path('private/key.pem').unlink()
          from faster_whisper import WhisperModel
          model=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          seg,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
          rows=[{'start':s.start,'end':s.end,'text':s.text,'words':[{'word':w.word,'start':w.start,'end':w.end,'probability':w.probability} for w in s.words]} for s in seg]
          (out/'06.json').write_text(json.dumps({'duration':info.duration,'segments':rows},ensure_ascii=False,indent=2))
          (out/'checksum.json').write_text(json.dumps({'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)},indent=2))
          print(' '.join(r['text'] for r in rows))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b001-revised-six
          path: out/
          retention-days: 1
          if-no-files-found: error
