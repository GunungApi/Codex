name: A001 revised narration
on:
  push:
    paths: ['.github/workflows/a001-reading-check.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Receive encrypted revised narration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,base64,time,subprocess,urllib.request,pathlib
          root=pathlib.Path('revision');root.mkdir()
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'a001-revision-private.pem'
          subprocess.run(['openssl','genpkey','-algorithm','RSA','-pkeyopt','rsa_keygen_bits:3072','-out',str(key)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          pub=subprocess.check_output(['openssl','pkey','-in',str(key),'-pubout'])
          api='https://api.github.com/repos/GunungApi/Codex/contents/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          data={'message':'Publish temporary A001 revision public key','content':base64.b64encode(pub).decode()}
          req=urllib.request.Request(api+'.media-relay/a001-revision-public.pem',data=json.dumps(data).encode(),headers=headers,method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r:r.read()
          enc=None
          for i in range(96):
              try:
                  req=urllib.request.Request(api+'.media-relay/a001-revision-request.json',headers=headers)
                  with urllib.request.urlopen(req,timeout=30) as r:obj=json.load(r)
                  enc=json.loads(base64.b64decode(obj['content']))['encrypted_url'];break
              except Exception:time.sleep(5)
          if enc is None:raise RuntimeError('Encrypted request missing')
          url=subprocess.check_output(['openssl','pkeyutl','-decrypt','-inkey',str(key),'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],input=base64.b64decode(enc)).decode()
          if not url.startswith('https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/'):raise RuntimeError('Unexpected host')
          print('::add-mask::'+url,flush=True)
          with urllib.request.urlopen(url,timeout=60) as r:audio=r.read()
          (root/'03_revised.mp3').write_bytes(audio)
          key.unlink()
          print('Saved revised audio:',len(audio),'bytes')
          PY
      - name: Check revised Japanese reading and word timing
        run: |
          python -m pip install -q faster-whisper
          python - <<'PY'
          import pathlib,json
          from faster_whisper import WhisperModel
          root=pathlib.Path('revision')
          for name in ['medium','large-v3']:
              model=WhisperModel(name,device='cpu',compute_type='int8',cpu_threads=4)
              segs,info=model.transcribe(str(root/'03_revised.mp3'),language='ja',beam_size=5,word_timestamps=True,vad_filter=True,initial_prompt='知性。宇宙。仮説。情報。')
              out=[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segs]
              (root/(name+'.json')).write_text(json.dumps(out,ensure_ascii=False,indent=2))
              print(name,''.join(s['text'] for s in out),flush=True)
              del model
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a001-revised-narration
          path: revision/
          retention-days: 1
