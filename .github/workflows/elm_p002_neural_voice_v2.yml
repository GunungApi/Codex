name: ELM P002 Japanese neural narration v2
on:
  push:
    paths: ['.github/workflows/elm_p002_neural_voice_v2.yml']
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        group: [first, second]
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU audio generation dependencies
        run: |
          python -m pip -q install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip -q install qwen-tts soundfile faster-whisper
          sudo apt-get update -qq
          sudo apt-get install -y -qq sox libsox-fmt-all
      - name: Generate new Japanese narration from the production script
        run: |
          mkdir -p narration
          python -u - <<'PY'
          import os,json,time,hashlib,platform,importlib.metadata
          from pathlib import Path
          import numpy as np
          import torch,soundfile as sf
          from qwen_tts import Qwen3TTSModel
          torch.set_num_threads(4)
          torch.manual_seed(2610112)
          scripts={
          1:'この細い柱が、頭の上の街を支えている。いったい、何でできているんだろう。',
          2:'オリオンわんで、広く使われる材料のひとつが、ダイヤモンドイド。たんそのつながりを、生かした材料だ。',
          3:'中をのぞくと、立体に連なる結晶、薄いシート、細いくだ。形の違うたんそを、組み合わせて使う。',
          4:'ダイヤモンドそのものは、硬くても、もろい。そこで、構造を組み合わせ、強さとしなやかさを両立させる。',
          5:'足元の重さは、はりから柱へ、そして地面へ。材料の力を、建物の形と組み合わせて使っている。',
          6:'紙に線を残した、あのたんそが、未来の街を支える。元素を知ると、見慣れた景色の、その奥が見えてくる。'}
          ids=[1,2,3] if os.environ['GROUP']=='first' else [4,5,6]
          model_id='Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice'
          style='自然な日本語の科学ドキュメンタリー。知的で親しみやすく、少し驚きを感じる、落ち着いた明瞭な語り。会話に近い自然な速さ。過度に幼い声や芝居がかった抑揚にしない。'
          model=Qwen3TTSModel.from_pretrained(model_id,device_map='cpu',dtype=torch.float32,attn_implementation='sdpa')
          records=[]
          for i in ids:
              print('GENERATING',i,flush=True);start=time.time()
              wavs,sr=model.generate_custom_voice(text=scripts[i],language='Japanese',speaker='Ono_Anna',instruct=style,max_new_tokens=400,do_sample=True,temperature=0.75,top_p=0.95,repetition_penalty=1.05)
              a=np.asarray(wavs[0],dtype=np.float32)
              assert a.ndim==1 and np.isfinite(a).all() and 2<len(a)/sr<32
              p=Path('narration',f'{i:02}.wav');sf.write(p,a,sr,subtype='PCM_16')
              rec={'index':i,'file':p.name,'text':scripts[i],'model':model_id,'voice':'Ono_Anna','instruction':style,'sample_rate':sr,'duration':len(a)/sr,'peak':float(np.max(np.abs(a))),'generation_seconds':time.time()-start,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
              records.append(rec);Path('narration',f'{i:02}_generation.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2))
              print(json.dumps(rec,ensure_ascii=False),flush=True)
          Path('narration','environment.json').write_text(json.dumps({'python':platform.python_version(),'packages':{k:importlib.metadata.version(k) for k in ['torch','qwen-tts','transformers','soundfile','faster-whisper']}},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elm-p002-new-voice-${{ matrix.group }}
          path: narration/
          retention-days: 7
          if-no-files-found: warn
      - name: Measure actual Japanese word timings
        run: |
          mkdir -p alignment
          python -u - <<'PY'
          from pathlib import Path
          from faster_whisper import WhisperModel
          import json
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(Path('narration').glob('*.wav')):
              segs,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              data={'file':p.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segs]}
              Path('alignment',p.stem+'_words.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
              print(p.name,[s['text'] for s in data['segments']],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: elm-p002-new-alignment-${{ matrix.group }}
          path: alignment/
          retention-days: 7
