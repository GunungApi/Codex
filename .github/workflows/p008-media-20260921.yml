name: P008 media preparation
on:
  push:
    paths:
      - '.github/workflows/p008-media-20260921.yml'
permissions:
  contents: write
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip download --only-binary=:all: moderngl glcontext -d wheels
      - uses: actions/upload-artifact@v4
        with:
          name: p008-render-wheels
          path: wheels
          retention-days: 1
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests cryptography faster-whisper
      - name: Retrieve encrypted media request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import os,time,json,base64,pathlib,re,subprocess
          import requests
          from cryptography.hazmat.primitives.asymmetric import rsa,padding
          from cryptography.hazmat.primitives import hashes,serialization
          key=rsa.generate_private_key(public_exponent=65537,key_size=2048)
          pub=key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo)
          session=requests.Session()
          session.headers.update({'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          api='https://api.github.com/repos/'+os.environ['GH_REPO']+'/contents/'
          dest='.p008-temporary/public.pem'
          r=session.get(api+dest,timeout=30)
          data={'message':'Publish ephemeral P008 request encryption public key','content':base64.b64encode(pub).decode()}
          if r.ok:data['sha']=r.json()['sha']
          r=session.put(api+dest,json=data,timeout=30);r.raise_for_status()
          print('P008 public key published; awaiting encrypted request',flush=True)
          payload=None
          for attempt in range(100):
              r=session.get(api+'.p008-temporary/request.b64',timeout=30)
              if r.ok:
                  try:
                      encrypted=base64.b64decode(base64.b64decode(r.json()['content']).strip())
                      payload=key.decrypt(encrypted,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode()
                      break
                  except Exception:pass
              time.sleep(8)
          if payload is None:raise RuntimeError('No decryptable media request')
          ids=payload.split(',')
          out=pathlib.Path('media');out.mkdir(exist_ok=True)
          http=requests.Session()
          for i,ident in enumerate(ids,1):
              print('::add-mask::'+ident,flush=True)
              u='https://www.aidocmaker.com/g0/audio?name='+ident
              success=False
              for attempt in range(12):
                  try:
                      r=http.get(u,timeout=90);r.raise_for_status()
                      ct=r.headers.get('content-type','')
                      if ('audio' in ct or 'octet-stream' in ct) and len(r.content)>2000:
                          (out/f'{i:02}.mp3').write_bytes(r.content);success=True;break
                      text=r.text
                      candidates=re.findall(r'https?[^\s<>"\x27]+',text)
                      candidates=[x.replace('&amp;','&').replace('\\u0026','&').replace('\\/','/') for x in candidates]
                      candidates=[x for x in candidates if any(k in x.lower() for k in ['.mp3','.wav','.m4a','audio_url','storage.googleapis.com'])]
                      for candidate in candidates:
                          rr=http.get(candidate,timeout=90)
                          if rr.ok and len(rr.content)>2000 and ('audio' in rr.headers.get('content-type','') or 'octet-stream' in rr.headers.get('content-type','')):
                              (out/f'{i:02}.mp3').write_bytes(rr.content);success=True;break
                      if success:break
                      (out/f'response_{i:02}.txt').write_text(text[:250000])
                  except Exception as e:print('Retry segment',i,type(e).__name__,flush=True)
                  time.sleep(10)
              print('Segment',i,'retrieved',success,flush=True)
          files=sorted(out.glob('*.mp3'))
          if not files:raise RuntimeError('Audio retrieval produced no playable files')
          from faster_whisper import WhisperModel
          model=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          records=[]
          for path in files:
              segs,info=model.transcribe(str(path),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              records.append({'file':path.name,'duration':info.duration,'segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segs]})
          (out/'transcription.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          for p in out.glob('response_*.txt'):p.unlink()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p008-narration
          path: media
          retention-days: 1
