name: P008 media preparation
on:
  push:
    paths: ['.github/workflows/p008-media-20260921.yml']
permissions:
  contents: write
  actions: write
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests cryptography faster-whisper
      - name: Retrieve encrypted media request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import os,time,json,base64,pathlib
          import requests
          from cryptography.hazmat.primitives.asymmetric import rsa,padding
          from cryptography.hazmat.primitives import hashes,serialization
          session=requests.Session()
          session.headers.update({'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          root='https://api.github.com/repos/'+os.environ['GH_REPO']
          session.post(root+'/actions/runs/35578296846/cancel',timeout=30)
          api=root+'/contents/'
          key=rsa.generate_private_key(public_exponent=65537,key_size=2048)
          pub=key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo)
          dest='.p008-temporary/public2.pem'
          r=session.get(api+dest,timeout=30)
          data={'message':'Publish ephemeral media-file request key','content':base64.b64encode(pub).decode()}
          if r.ok:data['sha']=r.json()['sha']
          r=session.put(api+dest,json=data,timeout=30);r.raise_for_status()
          print('Public request key ready',flush=True)
          payload=None
          for attempt in range(65):
              r=session.get(api+'.p008-temporary/request2.b64',timeout=30)
              if r.ok:
                  try:
                      raw=base64.b64decode(base64.b64decode(r.json()['content']).strip())
                      payload=key.decrypt(raw,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode();break
                  except Exception:pass
              time.sleep(6)
          if payload is None:raise RuntimeError('No decryptable request')
          out=pathlib.Path('media');out.mkdir(exist_ok=True)
          for i,ident in enumerate(payload.split(','),1):
              print('::add-mask::'+ident,flush=True)
              url='https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/'+ident+'.mp3'
              r=requests.get(url,timeout=90);r.raise_for_status()
              assert len(r.content)>10000
              (out/f'{i:02}.mp3').write_bytes(r.content)
              print('Saved segment',i,len(r.content),flush=True)
      - uses: actions/upload-artifact@v4
        with:
          name: p008-original-narration
          path: media/*.mp3
          retention-days: 1
      - name: Measure Japanese word timing
        shell: python
        run: |
          import json,pathlib
          from faster_whisper import WhisperModel
          model=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          records=[]
          for path in sorted(pathlib.Path('media').glob('*.mp3')):
              segs,info=model.transcribe(str(path),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              records.append({'file':path.name,'duration':info.duration,'segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segs]})
          pathlib.Path('media/transcription.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p008-narration-with-timing
          path: media
          retention-days: 1
