name: P021 narration and word timings
on:
  push:
    paths: ['.github/workflows/p021_narration_finish_20261012.yml']
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start official Japanese speech engine
        run: |
          docker run -d --name voicevox -p '127.0.0.1:50021:50021' voicevox/voicevox_engine:cpu-latest
          python -m pip -q install requests av faster-whisper
      - name: Generate original narration and pronunciation records
        run: |
          mkdir -p narration
          python - <<'PY'
          import json,time,hashlib,requests,av
          from pathlib import Path
          b='http://127.0.0.1:50021'
          for attempt in range(90):
              try:
                  r=requests.get(b+'/speakers',timeout=5)
                  if r.ok:break
              except requests.RequestException:pass
              time.sleep(2)
          r.raise_for_status()
          person=next(s for s in r.json() if s['name']=='四国めたん')
          sid=next(s['id'] for s in person['styles'] if s['name']=='ノーマル')
          texts=['二つの銀河が、重なっていく。中にある星も、次々にぶつかるんだろうか。','星と星のあいだには、広い空間がある。銀河が重なっても、多くの星は、ぶつからずにすれ違う。','それでも、重力は働く。星の進む道が変わり、銀河の外側が、長い尾のように引き伸ばされる。','一方、広く漂うガスは、ぶつかって押し縮められる。同じ出会いでも、星とガスでは、動き方が違う。','密に集まったガスが冷えると、新しい星が育つ場所になることもある。出会いが、次の星の舞台をつくる。','すれ違う星。押し縮められるガス。銀河の出会いは、次の世界の舞台を、組み替えていく。']
          readings=[('銀河','ギンガ',1),('重力','ジュウリョク',1),('圧縮','アッシュク',0),('衝突','ショウトツ',0),('軌道','キドウ',0),('外側','ソトガワ',0),('星','ホシ',0),('密','ミツ',1)]
          for word,kana,accent in readings:
              r=requests.post(b+'/user_dict_word',params={'surface':word,'pronunciation':kana,'accent_type':accent,'priority':8},timeout=20);r.raise_for_status()
          records=[]
          for i,text in enumerate(texts,1):
              spoken=text.replace('星','ほし').replace('尾の','おの')
              r=requests.post(b+'/audio_query',params={'text':spoken,'speaker':sid},timeout=60);r.raise_for_status();q=r.json()
              q.update(speedScale=0.98,pitchScale=-0.015,intonationScale=1.08,volumeScale=1.0,prePhonemeLength=0.15,postPhonemeLength=0.25,outputSamplingRate=48000,outputStereo=False)
              r=requests.post(b+'/synthesis',params={'speaker':sid},json=q,timeout=120);r.raise_for_status();p=Path('narration',f'{i:02d}.wav');p.write_bytes(r.content)
              a=av.open(str(p));duration=a.duration/av.time_base;frames=sum(1 for _ in a.decode(audio=0));assert 2<duration<25 and frames>1
              p.with_name(p.stem+'_query.json').write_text(json.dumps(q,ensure_ascii=False,indent=2))
              records.append({'file':p.name,'text':text,'spoken_text':spoken,'duration':duration,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'kana':q.get('kana'),'decoded_frames':frames})
              print(p.name,duration,q.get('kana'))
          Path('narration/retrieval.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          Path('narration/voice.json').write_text(json.dumps({'engine':'VOICEVOX','engine_version':requests.get(b+'/version').json(),'speaker':person,'selected_style_id':sid,'credit':'VOICEVOX:四国めたん','readings':readings},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p021-original-voice
          path: narration/
          retention-days: 3
      - name: Transcribe the waveform and measure words
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel
          m=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(Path('narration').glob('*.wav')):
              segs,info=m.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              d={'file':p.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segs]}
              p.with_name(p.stem+'_words.json').write_text(json.dumps(d,ensure_ascii=False,indent=2));print(p.name,[s['text'] for s in d['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p021-voice-with-timings
          path: narration/
          retention-days: 3
