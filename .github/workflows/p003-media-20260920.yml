name: P003 temporary encrypted media relay
on:
  push:
    paths: ['.github/workflows/p003-media-20260920.yml']
permissions:
  contents: read
concurrency:
  group: p003-media-20260920
  cancel-in-progress: true
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Make ephemeral receiver key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/p003-private.pem 2>/dev/null
          openssl pkey -in /tmp/p003-private.pem -pubout > /tmp/p003-public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: p003-public-key
          path: /tmp/p003-public.pem
          retention-days: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare rendering packages and transcription
        run: |
          mkdir -p /tmp/p003-result/wheels /tmp/p003-result/voice
          python -m pip download --only-binary=:all: moderngl glcontext -d /tmp/p003-result/wheels
          python -m pip install faster-whisper
          if ! command -v ffprobe; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: Receive encrypted locations and retrieve narration
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, time, json, base64, subprocess, pathlib
          dest=pathlib.Path('/tmp/p003-result')
          endpoint='https://raw.githubusercontent.com/GunungApi/Codex/main/.github/p003-media-input-20260920.json'
          payload=None
          for _ in range(100):
              try:
                  with urllib.request.urlopen(endpoint+'?t='+str(time.time_ns()), timeout=20) as r:
                      payload=json.load(r)
                  break
              except (urllib.error.URLError, json.JSONDecodeError):
                  time.sleep(12)
          if payload is None: raise RuntimeError('Encrypted input not received')
          records=[]
          for i,enc in enumerate(payload['encrypted_locations'],1):
              cipher=pathlib.Path('/tmp/p003-cipher.bin');cipher.write_bytes(base64.b64decode(enc))
              result=subprocess.run(['openssl','pkeyutl','-decrypt','-inkey','/tmp/p003-private.pem','-in',str(cipher),'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],capture_output=True,check=True)
              url=result.stdout.decode().strip()
              if not url.startswith('https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/'): raise RuntimeError('Unexpected audio host')
              path=dest/'voice'/f'{i:02}.mp3'
              with urllib.request.urlopen(url,timeout=60) as r: path.write_bytes(r.read())
              probe=subprocess.run(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(path)],capture_output=True,text=True,check=True)
              records.append({'file':path.name,'probe':json.loads(probe.stdout)})
              print('Retrieved',path.name,path.stat().st_size,'bytes',flush=True)
          pathlib.Path('/tmp/p003-private.pem').unlink(missing_ok=True)
          (dest/'probe.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          from faster_whisper import WhisperModel
          model=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          all_results=[]
          for path in sorted((dest/'voice').glob('*.mp3')):
              segments,info=model.transcribe(str(path),language='ja',word_timestamps=True,beam_size=5,vad_filter=True)
              out=[]
              for s in segments:
                  out.append({'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]})
              all_results.append({'file':path.name,'segments':out})
              print('Transcribed',path.name,flush=True)
          (dest/'transcription_words.json').write_text(json.dumps(all_results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p003-media-20260920
          path: /tmp/p003-result
          retention-days: 1
