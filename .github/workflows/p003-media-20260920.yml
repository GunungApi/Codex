name: P003 recovered narration alignment check
on:
  push:
    paths: ['.github/workflows/p003-media-20260920.yml']
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check preserved narration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install faster-whisper
          python - <<'PY'
          import os,urllib.request,zipfile,io,pathlib,json
          req=urllib.request.Request('https://api.github.com/repos/GunungApi/Codex/actions/artifacts/10590194673/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req) as r: data=r.read()
          root=pathlib.Path('/tmp/p003check');root.mkdir()
          zipfile.ZipFile(io.BytesIO(data)).extractall(root)
          from faster_whisper import WhisperModel
          model=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          results=[]
          for path in sorted((root/'voice').glob('*.mp3')):
              segments,info=model.transcribe(str(path),language='ja',word_timestamps=True,beam_size=5,vad_filter=False,initial_prompt='物質、反物質、対消滅、粒子、ひと組ずつ、相手のいない分が残ります、偏り。')
              out=[]
              for s in segments:out.append({'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]})
              results.append({'file':path.name,'segments':out})
              print(path.name, ''.join(s['text'] for s in out),flush=True)
          (root/'transcription_medium.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p003-alignment-checked
          path: /tmp/p003check/transcription_medium.json
          retention-days: 1
