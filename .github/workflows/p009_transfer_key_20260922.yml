name: P009 protected transfer setup
on:
  push:
    paths: ['.github/workflows/p009_transfer_key_20260922.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Generate short-lived transfer key
        run: |
          mkdir -p private
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out private/key.pem 2>/dev/null
          openssl pkey -in private/key.pem -pubout -out public.pem
          cat public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: p009-transfer-key
          path: private/
          retention-days: 1
