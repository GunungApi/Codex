name: PHYS022 opening ending refinement
on:
  push:
    paths: ['.github/workflows/phys022_complete_audio_20261005.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover refined opening and word timings
        run: |
          python -m pip -q install playwright requests av faster-whisper
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p refined
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, urllib.parse, requests, av
          from playwright.sync_api import sync_playwright
          from faster_whisper import WhisperModel
          with sync_playwright() as pw:
              b=pw.chromium.launch(headless=True); p=b.new_page()
              p.goto('https://www.aidocmaker.com/g0/audio?name=7c588b36b36347ecb7221b51a7129175',wait_until='domcontentloaded',timeout=90000)
              sources=[]
              for attempt in range(70):
                  sources=p.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                  if sources: break
                  p.wait_for_timeout(1000)
              assert sources
              src=sources[0];u=urllib.parse.urlparse(src);assert u.scheme=='https' and u.netloc=='storage.googleapis.com'
              print('::add-mask::'+src);r=requests.get(src,timeout=60);r.raise_for_status()
              f=Path('refined/01.mp3');f.write_bytes(r.content);b.close()
          m=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          seg,info=m.transcribe(str(f),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
          d={'file':f.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in seg]}
          Path('refined/01_words.json').write_text(json.dumps(d,ensure_ascii=False,indent=2))
          Path('refined/retrieval.json').write_text(json.dumps({'file':f.name,'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'duration':info.duration},indent=2))
          print(info.duration,[s['text'] for s in d['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phys022-refined-opening
          path: refined/
          retention-days: 7
