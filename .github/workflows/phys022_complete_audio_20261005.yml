name: PHYS022 approved narration recovery
on:
  push:
    paths: ['.github/workflows/phys022_complete_audio_20261005.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover six commissioned audio files and word timings
        run: |
          python -m pip -q install playwright requests av faster-whisper
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p narration
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, urllib.parse, requests, av
          from playwright.sync_api import sync_playwright
          from faster_whisper import WhisperModel
          pages={'01':'3ecd2230d6dc42779ca769d0b05884f2','02':'46d8b7eec92e468a83898663c3c8e5eb','03':'a43138db5d9f474e902c7215b1731435','04':'b354edad53cc494d99b3d7b6bf7f8589','05':'d01ca32c970941e69416251d25c2863e','06':'367f324b84144051a91951f8c17c9f1d'}
          records=[]
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              for number,cid in pages.items():
                  page=browser.new_page()
                  page.goto('https://www.aidocmaker.com/g0/audio?name='+cid,wait_until='domcontentloaded',timeout=90000)
                  sources=[]
                  for attempt in range(70):
                      sources=page.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                      if sources: break
                      page.wait_for_timeout(1000)
                  assert sources,'No playable source '+number
                  src=sources[0]; u=urllib.parse.urlparse(src)
                  assert u.scheme=='https' and u.netloc=='storage.googleapis.com'
                  print('::add-mask::'+src)
                  r=requests.get(src,timeout=60); r.raise_for_status()
                  p=Path('narration',number+'.mp3'); p.write_bytes(r.content)
                  with av.open(str(p)) as a:
                      duration=a.duration/av.time_base
                      count=sum(1 for f in a.decode(audio=0))
                  assert 2<duration<30 and count>10
                  records.append({'file':p.name,'duration':duration,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'decoded_frames':count})
                  page.close()
              browser.close()
          Path('narration/retrieval.json').write_text(json.dumps(records,indent=2))
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(Path('narration').glob('*.mp3')):
              segments,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              data={'file':p.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segments]}
              p.with_name(p.stem+'_words.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
              print(p.name,info.duration,[s['text'] for s in data['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phys022-complete-narration
          path: narration/
          retention-days: 7
