name: Angelnet offline rendering dependencies
on:
  push:
    branches: ['luna/angelnet-media-20260921']
    paths: ['.github/workflows/angelnet-render-dependencies.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip download --only-binary=:all: --no-deps moderngl==5.12.0 glcontext==3.0.0 -d wheels
      - uses: actions/upload-artifact@v4
        with:
          name: angelnet-render-wheels
          path: wheels/
          retention-days: 2
