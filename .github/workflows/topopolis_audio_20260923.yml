name: Topopolis narration recovery and alignment
on:
  push:
    paths: ['.github/workflows/topopolis_audio_20260923.yml']
permissions:
  contents: read
  actions: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: topopolis-transfer-key
          path: private
          run-id: 35770485655
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover generated narration without exposing temporary links
        run: |
          python -m pip install --quiet cryptography requests faster-whisper
          python - <<'PY'
          import pathlib,base64,requests,urllib.parse,json,subprocess
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          key=serialization.load_pem_private_key(pathlib.Path('private/key.pem').read_bytes(),password=None)
          encrypted=[
          '',
          '',
          '']
          out=pathlib.Path('audio');out.mkdir()
          for i,enc in enumerate(encrypted,1):
              url=key.decrypt(base64.b64decode(enc),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode()
              u=urllib.parse.urlparse(url)
              assert u.scheme=='https' and u.netloc=='storage.googleapis.com' and u.path.startswith('/adm--audio-playback--7d--public/mcp-preview/') and u.path.endswith('.mp3')
              print('::add-mask::'+url)
              r=requests.get(url,timeout=45,allow_redirects=False);r.raise_for_status();assert 10000<len(r.content)<10000000
              (out/f'{i:02d}.mp3').write_bytes(r.content)
              print('Recovered segment',i,len(r.content))
          pathlib.Path('private/key.pem').unlink()
          from faster_whisper import WhisperModel
          model=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          result=[]
          for i in range(1,4):
              seg,info=model.transcribe(str(out/f'{i:02d}.mp3'),language='ja',beam_size=5,word_timestamps=True,vad_filter=True,condition_on_previous_text=False)
              data=[{'start':s.start,'end':s.end,'text':s.text,'words':[{'word':w.word,'start':w.start,'end':w.end,'probability':w.probability} for w in s.words]} for s in seg]
              result.append({'file':f'{i:02d}.mp3','duration':info.duration,'segments':data})
              print(i,info.duration, ''.join(s['text'] for s in data))
          (out/'transcription_words.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topopolis-narration
          path: audio/
          retention-days: 2
          if-no-files-found: error
