name: PHYS020 scale narration
on:
  push:
    paths: ['.github/workflows/phys020_scale_voice_20261005.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve commissioned narration and align speech
        run: |
          python -m pip -q install playwright requests av faster-whisper
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p narration
          python - <<'PY'
          import json,hashlib,urllib.parse,requests,av
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from faster_whisper import WhisperModel
          pages={'01':'da36fde8601f45a8ba0f237ee149302d','02':'0ebd5196312d4faab0cd011798ee2b7c','03':'e33c5f2642c74dc5b066099535073583','04':'a78b6cf3fd9f45f484a061dd7df8bff7','05':'35f7c307e1b64af0949e1e00c287465a','06':'f54a3e485c8b48bf85b24e60d0302bbf'}
          records=[]
          with sync_playwright() as pw:
              b=pw.chromium.launch(headless=True)
              for no,cid in pages.items():
                  p=b.new_page();p.goto('https://www.aidocmaker.com/g0/audio?name='+cid,wait_until='domcontentloaded',timeout=90000)
                  srcs=[]
                  for attempt in range(60):
                      srcs=p.locator('audio,audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                      if srcs:break
                      p.wait_for_timeout(1000)
                  assert srcs,'Missing commissioned audio '+no
                  u=urllib.parse.urlparse(srcs[0]);assert u.scheme=='https' and u.netloc=='storage.googleapis.com'
                  print('::add-mask::'+srcs[0]);r=requests.get(srcs[0],timeout=60);r.raise_for_status()
                  f=Path('narration',no+'.mp3');f.write_bytes(r.content)
                  ac=av.open(str(f));dur=ac.duration/av.time_base;frames=sum(1 for x in ac.decode(audio=0));assert 2<dur<25 and frames>10
                  records.append({'file':f.name,'duration':dur,'decoded_frames':frames,'sha256':hashlib.sha256(r.content).hexdigest()});p.close()
              b.close()
          Path('narration/retrieval.json').write_text(json.dumps(records,indent=2))
          m=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          for f in sorted(Path('narration').glob('*.mp3')):
              ss,info=m.transcribe(str(f),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              data={'file':f.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in ss]}
              f.with_name(f.stem+'_words.json').write_text(json.dumps(data,ensure_ascii=False,indent=2));print(f.name,[s['text'] for s in data['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phys020-scale-narration
          path: narration/
          retention-days: 7
