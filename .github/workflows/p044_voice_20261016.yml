name: P044 original narration
on:
  push:
    paths: ['.github/workflows/p044_voice_20261016.yml']
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start approved Japanese voice engine
        run: |
          docker run -d --name voicevox -p '127.0.0.1:50021:50021' voicevox/voicevox_engine:cpu-latest
          python -m pip -q install requests faster-whisper
      - name: Generate originals and independently transcribe waveforms
        run: python p044_20261016/voice.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p044-original-narration-with-timings
          path: |
            p044/audio/raw/
            p044_20261016/voice_expanded.py
          retention-days: 14
