name: P020 reading refinement
on:
  push:
    paths: ['.github/workflows/p020_reading_20261012.yml']
permissions:
  contents: read
jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start speech engine
        run: |
          docker run -d --name voicevox -p '127.0.0.1:50021:50021' voicevox/voicevox_engine:cpu-latest
          python -m pip -q install requests av faster-whisper
      - name: Refine third section
        run: |
          mkdir -p narration
          python - <<'PY'
          import json,time,hashlib,requests,av
          from pathlib import Path
          b='http://127.0.0.1:50021'
          for attempt in range(90):
              try:
                  r=requests.get(b+'/speakers',timeout=5)
                  if r.ok:break
              except requests.RequestException:pass
              time.sleep(2)
          r.raise_for_status()
          for word,kana,accent in [('炭素','タンソ',1),('酸素','サンソ',1)]:
              requests.post(b+'/user_dict_word',params={'surface':word,'pronunciation':kana,'accent_type':accent,'priority':8},timeout=20).raise_for_status()
          text='星の中で増えた、炭素や酸素。それを含むガスが外へ広がり、次の星の材料へ、受け渡されていく。'
          spoken='ほしの中で増えた、炭素や酸素。それを含むガスが外へ広がり、次のほしの材料へ、うけわたされていく。'
          r=requests.post(b+'/audio_query',params={'text':spoken,'speaker':2},timeout=60);r.raise_for_status();q=r.json()
          q.update(speedScale=1.0,pitchScale=-0.015,intonationScale=1.08,volumeScale=1.0,prePhonemeLength=0.15,postPhonemeLength=0.25,outputSamplingRate=48000,outputStereo=False)
          r=requests.post(b+'/synthesis',params={'speaker':2},json=q,timeout=120);r.raise_for_status();p=Path('narration/03.wav');p.write_bytes(r.content)
          a=av.open(str(p));duration=a.duration/av.time_base;frames=sum(1 for _ in a.decode(audio=0))
          Path('narration/03_query.json').write_text(json.dumps(q,ensure_ascii=False,indent=2))
          Path('narration/03_retrieval.json').write_text(json.dumps({'file':p.name,'text':text,'spoken_text':spoken,'duration':duration,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'kana':q['kana'],'decoded_frames':frames},ensure_ascii=False,indent=2))
          print(q['kana'])
          from faster_whisper import WhisperModel
          m=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          segs,info=m.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
          d={'file':p.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segs]}
          Path('narration/03_words.json').write_text(json.dumps(d,ensure_ascii=False,indent=2));print([s['text'] for s in d['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p020-reading-refined
          path: narration/
          retention-days: 3
