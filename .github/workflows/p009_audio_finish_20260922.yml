name: P009 audio recovery and word timestamps
on:
  push:
    paths: ['.github/workflows/p009_audio_finish_20260922.yml']
permissions:
  contents: read
  actions: read
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: p009-transfer-key
          path: private
          run-id: 35651659079
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover synthetic narration from its allowed audio host
        run: |
          python -m pip install cryptography requests
          python - <<'PY'
          import base64,pathlib,requests,json,hashlib,urllib.parse
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          key=serialization.load_pem_private_key(pathlib.Path('private/key.pem').read_bytes(),password=None)
          encrypted=json.loads(pathlib.Path('production_transfer/p009.encrypted.json').read_text())
          assert len(encrypted)==7
          pathlib.Path('originals').mkdir();records=[]
          for i,e in enumerate(encrypted,1):
              url=key.decrypt(base64.b64decode(e),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode()
              u=urllib.parse.urlparse(url)
              assert u.scheme=='https' and u.netloc=='storage.googleapis.com' and u.path.startswith('/adm--audio-playback--7d--public/mcp-preview/') and u.path.endswith('.mp3')
              print('::add-mask::'+url)
              r=requests.get(url,timeout=45,allow_redirects=False);r.raise_for_status();assert len(r.content)<10000000
              p=pathlib.Path(f'originals/{i:02}.mp3');p.write_bytes(r.content)
              records.append({'file':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
              print('Recovered',p.name,p.stat().st_size)
          pathlib.Path('originals/retrieval.json').write_text(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p009-narration-originals
          path: originals/
          retention-days: 7
          if-no-files-found: error
      - name: Recognize Japanese words to assist subtitle alignment
        run: |
          python -m pip install faster-whisper
          mkdir -p aligned
          python - <<'PY'
          from faster_whisper import WhisperModel
          import pathlib,json
          model=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(pathlib.Path('originals').glob('*.mp3')):
              segments,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False,initial_prompt='宇宙の暗黒時代。水素とヘリウム。原子。星空。重力。光らない物質。')
              result={'file':p.name,'duration':info.duration,'language':info.language,'segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segments]}
              pathlib.Path('aligned',p.stem+'.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
              print(p.name,[(s['start'],s['end'],s['text']) for s in result['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p009-word-alignment
          path: aligned/
          retention-days: 7
          if-no-files-found: error
