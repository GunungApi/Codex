name: A001 encrypted media relay
on:
  push:
    paths: ['.github/workflows/a001-media-relay.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare native rendering wheels
        run: |
          mkdir -p runtime/wheels
          python -m pip download --only-binary=:all: moderngl glcontext -d runtime/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: a001-runtime
          path: runtime/
          retention-days: 1
      - name: Receive encrypted media locations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,base64,time,subprocess,urllib.request,pathlib
          root=pathlib.Path('media');root.mkdir(exist_ok=True)
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'a001-private.pem'
          subprocess.run(['openssl','genpkey','-algorithm','RSA','-pkeyopt','rsa_keygen_bits:3072','-out',str(key)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          pub=subprocess.check_output(['openssl','pkey','-in',str(key),'-pubout'])
          api='https://api.github.com/repos/'+os.environ['REPO']+'/contents/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              req=urllib.request.Request(api+path,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          path='.media-relay/a001-public.pem'
          data={'message':'Publish temporary A001 encryption public key','content':base64.b64encode(pub).decode()}
          try:data['sha']=get(path)['sha']
          except Exception:pass
          req=urllib.request.Request(api+path,data=json.dumps(data).encode(),headers=headers,method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r: r.read()
          print('Public key ready. Waiting for encrypted request.',flush=True)
          request=None
          for i in range(120):
              try:
                  obj=get('.media-relay/a001-request.json')
                  request=json.loads(base64.b64decode(obj['content']))
                  break
              except Exception:time.sleep(5)
          if request is None:raise RuntimeError('Encrypted request not received')
          metadata=[]
          for i,enc in enumerate(request['encrypted_urls'],1):
              clear=subprocess.check_output(['openssl','pkeyutl','-decrypt','-inkey',str(key),'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],input=base64.b64decode(enc)).decode()
              if not clear.startswith('https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/'):raise RuntimeError('Unexpected audio host')
              print('::add-mask::'+clear,flush=True)
              for retry in range(4):
                  try:
                      with urllib.request.urlopen(clear,timeout=60) as r:raw=r.read()
                      if len(raw)<10000:raise RuntimeError('Audio too short')
                      (root/f'{i:02d}.mp3').write_bytes(raw)
                      metadata.append({'file':f'{i:02d}.mp3','bytes':len(raw)})
                      print('Recovered segment',i,flush=True)
                      break
                  except Exception:
                      if retry==3:raise RuntimeError('Audio download failed without exposing URL') from None
                      time.sleep(5)
          key.unlink()
          (root/'recovery.json').write_text(json.dumps({'segments':metadata,'method':'ephemeral RSA OAEP encrypted request; private key deleted'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a001-raw-audio
          path: media/
          retention-days: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Align Japanese narration
        run: |
          python -m pip install -q faster-whisper
          python - <<'PY'
          from faster_whisper import WhisperModel
          import json,pathlib
          model=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          for path in sorted(pathlib.Path('media').glob('*.mp3')):
              segs,info=model.transcribe(str(path),language='ja',beam_size=5,word_timestamps=True,vad_filter=True,initial_prompt='オリオン腕。アルファ文明。原子。知性。宇宙。仮説。応答。')
              data=[]
              for s in segs:
                  data.append({'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]})
              path.with_suffix('.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a001-aligned-audio
          path: media/
          retention-days: 1
