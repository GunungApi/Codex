name: P067 v3 basalt and spatial time
on:
  push:
    branches: ['production/p067-v3-rocktime-20261028']
    paths: ['production/p067v3_rocktime.py', '.github/workflows/p067_v3_rocktime_20261028.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: p067-v3-rocktime
  cancel-in-progress: true
env:
  LIBGL_ALWAYS_SOFTWARE: '1'
  LP_NUM_THREADS: '3'
  OMP_NUM_THREADS: '3'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare bounded rendering environment
        run: |
          sudo timeout 100 apt-get install -y -qq ffmpeg libegl1 libegl-mesa0 libgl1-mesa-dri >/tmp/p067v3-system.log 2>&1 || { cat /tmp/p067v3-system.log; exit 1; }
          python -m pip install --quiet --timeout 30 numpy scipy Pillow moderngl==5.12.0 glcontext==3.0.0
          curl -fsSL --retry 2 --max-time 80 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Bold.otf -o "$RUNNER_TEMP/NotoSansCJKjp-Bold.otf"
          echo "P067_FONT=$RUNNER_TEMP/NotoSansCJKjp-Bold.otf" >> "$GITHUB_ENV"
          python -m py_compile production/p067v3_rocktime.py
      - uses: actions/download-artifact@v4
        with:
          name: p067-v1-audio
          run-id: 40693127363
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: recovered_audio
      - name: Recover exact approved narration
        run: python production/p067v3_rocktime.py prepare
      - name: Test texture, labels, camera clearances and continuous motion
        run: |
          set -o pipefail
          python -u production/p067v3_rocktime.py preview 2>&1 | tee preflight_console.log
          python -u production/p067v3_rocktime.py testclip 2>&1 | tee testclip_console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p067-v3-preflight
          path: |
            p067_v3/render
            p067_v3/review
            p067_v3/assets
          retention-days: 30
          compression-level: 1
  shot:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        scene: [0,1,4,5,6,7,8,9]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare native renderer
        run: |
          sudo timeout 100 apt-get install -y -qq ffmpeg libegl1 libegl-mesa0 libgl1-mesa-dri >/tmp/p067v3-system.log 2>&1 || { cat /tmp/p067v3-system.log; exit 1; }
          python -m pip install --quiet --timeout 30 numpy scipy Pillow moderngl==5.12.0 glcontext==3.0.0
          curl -fsSL --retry 2 --max-time 80 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Bold.otf -o "$RUNNER_TEMP/NotoSansCJKjp-Bold.otf"
          echo "P067_FONT=$RUNNER_TEMP/NotoSansCJKjp-Bold.otf" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: p067-v1-audio
          run-id: 40693127363
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: recovered_audio
      - name: Render native shot with terrain collision checks
        run: |
          python production/p067v3_rocktime.py prepare
          python -u production/p067v3_rocktime.py shot ${{ matrix.scene }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p067-v3-shot-${{ matrix.scene }}
          path: |
            p067_v3/render
            p067_v3/review
          compression-level: 0
          retention-days: 30
  assemble:
    needs: shot
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare finishing environment
        run: |
          sudo timeout 100 apt-get install -y -qq ffmpeg libegl1 libegl-mesa0 libgl1-mesa-dri >/tmp/p067v3-system.log 2>&1 || { cat /tmp/p067v3-system.log; exit 1; }
          python -m pip install --quiet --timeout 30 numpy scipy Pillow moderngl==5.12.0 glcontext==3.0.0
          curl -fsSL --retry 2 --max-time 80 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Bold.otf -o "$RUNNER_TEMP/NotoSansCJKjp-Bold.otf"
          echo "P067_FONT=$RUNNER_TEMP/NotoSansCJKjp-Bold.otf" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: p067-v1-audio
          run-id: 40693127363
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: recovered_audio
      - uses: actions/download-artifact@v4
        with:
          name: heionreki-p067-v2-preview
          run-id: 40698801062
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original_preview
      - name: Restore unchanged sound and timing
        run: python production/p067v3_rocktime.py prepare
      - uses: actions/download-artifact@v4
        with:
          name: p067-v3-preflight
          path: p067_v3
      - uses: actions/download-artifact@v4
        with:
          pattern: p067-v3-shot-*
          merge-multiple: true
          path: p067_v3
      - name: Assemble, fully decode, compare audio hashes and package
        run: |
          set -o pipefail
          python -m pip freeze > p067_v3/source/requirements-lock.txt
          python -u production/p067v3_rocktime.py assemble 2>&1 | tee final_console.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: heionreki-p067-v3-delivery
          path: p067_v3/deliverables
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: heionreki-p067-v3-preview
          path: p067_v3/deliverables/heionreki_p067_v3_light_720x1280.mp4
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heionreki-p067-v3-review
          path: |
            p067_v3/review
            p067_v3/timeline.json
            final_console.log
          compression-level: 3
          retention-days: 30
