name: Luna Angelnet media preparation
on:
  push:
    branches: ['luna/angelnet-media-20260921']
    paths: ['.github/workflows/luna-angelnet-media-20260921.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the five generated narration clips
        run: |
          mkdir -p media
          python - <<'PY'
          import urllib.request, pathlib
          ids = ['ad8bf1f2-0255-49e2-99dd-c32ec28ff1dd','763ebe87-96cc-40ff-81c5-2a75e1cc77ae','def2ee75-3e9a-4112-bbc2-137913fa2cae','8ff73b40-4ebd-45e4-bec7-56d60c521bb8','88b55978-a7a9-4106-97ac-c2f914ca2fe3']
          for i, ident in enumerate(ids, 1):
              url = 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/' + ident + '.mp3'
              urllib.request.urlretrieve(url, f'media/narration_{i:02}.mp3')
              assert pathlib.Path(f'media/narration_{i:02}.mp3').stat().st_size > 10000
          PY
      - name: Save original generated voice clips
        uses: actions/upload-artifact@v4
        with:
          name: angelnet-original-audio
          path: media/*.mp3
          retention-days: 3
      - name: Install speech timing analysis
        run: python -m pip -q install faster-whisper
      - name: Recognize Japanese speech and word timings
        run: |
          python - <<'PY'
          import json, pathlib
          from faster_whisper import WhisperModel
          model = WhisperModel('small', device='cpu', compute_type='int8', cpu_threads=3)
          for p in sorted(pathlib.Path('media').glob('*.mp3')):
              segs, info = model.transcribe(str(p), language='ja', beam_size=5, word_timestamps=True, vad_filter=True)
              data = {'language': info.language, 'duration': info.duration, 'segments': []}
              for s in segs:
                  data['segments'].append({'start': s.start, 'end': s.end, 'text': s.text, 'words': [{'start': w.start, 'end': w.end, 'word': w.word, 'probability': w.probability} for w in s.words]})
              p.with_suffix('.json').write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
              print(p.name, data['duration'], ''.join(s['text'] for s in data['segments']), flush=True)
          PY
      - name: Save analyzed narration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angelnet-audio-with-timing
          path: media/
          retention-days: 3
