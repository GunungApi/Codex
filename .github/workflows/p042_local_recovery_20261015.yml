name: P042 local rendering recovery
on:
  push:
    paths:
      - '.github/workflows/p042_local_recovery_20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package source and binary rendering dependencies
        shell: bash
        run: |
          mkdir -p recovery/source recovery/wheels
          cp -r p041_20261015 p042_20261015 recovery/source/
          python -m pip download --only-binary=:all: --dest recovery/wheels moderngl glcontext
          python -m pip --version > recovery/packaging_environment.txt
          python --version >> recovery/packaging_environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p042-local-rendering-recovery
          path: recovery/
          retention-days: 7
