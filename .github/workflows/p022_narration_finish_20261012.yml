name: P022 original narration finish
on:
  push:
    paths: ['.github/workflows/p022_narration_finish_20261012.yml']
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start official Japanese narration engine
        run: |
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          python -m pip -q install requests av faster-whisper
      - name: Generate authored narration and pronunciation records
        run: |
          mkdir -p narration
          python - <<'PY'
          import json,time,hashlib,requests,av
          from pathlib import Path
          base='http://127.0.0.1:50021'
          for attempt in range(90):
              try:
                  response=requests.get(base+'/speakers',timeout=5)
                  if response.ok: break
              except requests.RequestException: pass
              time.sleep(2)
          response.raise_for_status()
          person=next(s for s in response.json() if s['name']=='四国めたん')
          speaker=next(s['id'] for s in person['styles'] if s['name']=='ノーマル')
          texts=['銀河を横から見ると、薄い円盤。どうして、ガスの集まりから、この形が育つんだろう。','ガスは、いろいろな向きに動いている。ぶつかると、ばらばらな動きの一部が、熱に変わる。','その熱を、光として外へ逃がす。ガスは冷え、重力に引かれて、より内側へ集まっていく。','でも、全体の回転は残る。上下の動きが弱まる一方、中心のまわりを回り続けて、円盤へ落ち着く。','そのガスから生まれた星も、回る動きを受け継ぐ。流れ込み方や、銀河どうしの出会いで、厚みも変わる。','熱を逃がし、回転を残す。銀河の薄い輪郭には、材料がどう集まってきたか、その歴史が刻まれている。']
          readings=[('銀河','ギンガ',1),('円盤','エンバン',0),('重力','ジュウリョク',1),('回転','カイテン',0),('上下','ジョウゲ',1),('輪郭','リンカク',0),('内側','ウチガワ',0),('厚み','アツミ',0)]
          for surface,pronunciation,accent in readings:
              r=requests.post(base+'/user_dict_word',params={'surface':surface,'pronunciation':pronunciation,'accent_type':accent,'priority':8},timeout=20)
              r.raise_for_status()
          records=[]
          for number,text in enumerate(texts,1):
              spoken=text.replace('星も','ほしも')
              r=requests.post(base+'/audio_query',params={'text':spoken,'speaker':speaker},timeout=60);r.raise_for_status();query=r.json()
              query.update(speedScale=0.98,pitchScale=-0.015,intonationScale=1.08,volumeScale=1.0,prePhonemeLength=0.15,postPhonemeLength=0.25,outputSamplingRate=48000,outputStereo=False)
              r=requests.post(base+'/synthesis',params={'speaker':speaker},json=query,timeout=120);r.raise_for_status()
              path=Path('narration',f'{number:02d}.wav');path.write_bytes(r.content)
              audio=av.open(str(path));duration=audio.duration/av.time_base;frames=sum(1 for _ in audio.decode(audio=0))
              assert 2<duration<25 and frames>1
              path.with_name(path.stem+'_query.json').write_text(json.dumps(query,ensure_ascii=False,indent=2))
              records.append({'file':path.name,'text':text,'spoken_text':spoken,'duration':duration,'sha256':hashlib.sha256(r.content).hexdigest(),'kana':query.get('kana'),'decoded_frames':frames})
              print(path.name,duration,query.get('kana'))
          Path('narration/retrieval.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          Path('narration/voice.json').write_text(json.dumps({'engine':'VOICEVOX','engine_version':requests.get(base+'/version').json(),'speaker':person,'selected_style_id':speaker,'credit':'VOICEVOX:四国めたん','readings':readings},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p022-original-narration
          path: narration/
          retention-days: 3
      - name: Measure speech word timings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          for path in sorted(Path('narration').glob('*.wav')):
              segments,info=model.transcribe(str(path),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              data={'file':path.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segments]}
              path.with_name(path.stem+'_words.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
              print(path.name,[s['text'] for s in data['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p022-narration-with-timings
          path: narration/
          retention-days: 3
