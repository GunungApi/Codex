name: P017 authored narration synthesis
on:
  push:
    paths: ['.github/workflows/p017_speech_synthesis_20261011.yml']
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start official Japanese speech engine
        run: |
          docker run -d --name voicevox -p '127.0.0.1:50021:50021' voicevox/voicevox_engine:cpu-latest
          python -m pip -q install requests av faster-whisper
      - name: Synthesize original script and save pronunciation data
        run: |
          mkdir -p narration
          python - <<'PY'
          import json,time,hashlib,requests,av
          from pathlib import Path
          base='http://127.0.0.1:50021'
          for attempt in range(90):
              try:
                  r=requests.get(base+'/speakers',timeout=5)
                  if r.ok: break
              except requests.RequestException: pass
              time.sleep(2)
          r.raise_for_status();speakers=r.json()
          person=next(s for s in speakers if s['name']=='四国めたん')
          sid=next(s['id'] for s in person['styles'] if s['name']=='ノーマル')
          texts=['最初の銀河は、もう、きれいな渦巻きだった？ 星の集まりから、ぐっと外へ出てみよう。','宇宙が生まれて、数億年。ここは、育ち始めた銀河の模型。星とガスが、まだらに集まっている。','暗黒物質の重力が、ガスを集める。冷えて濃くなった場所では、新しい星が生まれる。','星の光や爆発は、ガスを温め、押し広げる。集まる流れと、吹き出す流れが、同じ銀河で起きている。','近くの小さな銀河とも引き合い、形を変えながら合体する。こうした出会いも、銀河を育てていく。','銀河は、星が生まれ、材料が巡る場所。遠い未来へ続く歴史は、こんな小さな集まりから、育っていく。']
          readings=[('銀河','ギンガ',1),('暗黒物質','アンコクブッシツ',5),('重力','ジュウリョク',1),('渦巻き','ウズマキ',2),('数億年','スウオクネン',4)]
          for word,kana,accent in readings:
              q=requests.post(base+'/user_dict_word',params={'surface':word,'pronunciation':kana,'accent_type':accent,'priority':8},timeout=20);q.raise_for_status()
          records=[]
          for i,text in enumerate(texts,1):
              r=requests.post(base+'/audio_query',params={'text':text,'speaker':sid},timeout=60);r.raise_for_status();q=r.json()
              q.update(speedScale=1.02,pitchScale=-0.015,intonationScale=1.08,volumeScale=1.0,prePhonemeLength=0.15,postPhonemeLength=0.25,outputSamplingRate=48000,outputStereo=False)
              p=Path('narration',f'{i:02d}.wav')
              r=requests.post(base+'/synthesis',params={'speaker':sid},json=q,timeout=120);r.raise_for_status();p.write_bytes(r.content)
              a=av.open(str(p));duration=a.duration/av.time_base;frames=sum(1 for _ in a.decode(audio=0));assert 2<duration<25 and frames>1
              p.with_name(p.stem+'_query.json').write_text(json.dumps(q,ensure_ascii=False,indent=2))
              records.append({'file':p.name,'text':text,'duration':duration,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'kana':q.get('kana'),'decoded_frames':frames})
              print(p.name,duration,q.get('kana'))
          Path('narration/retrieval.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          Path('narration/voice.json').write_text(json.dumps({'engine':'VOICEVOX','engine_version':requests.get(base+'/version').json(),'speaker':person,'selected_style_id':sid,'credit':'VOICEVOX:四国めたん','readings':readings},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p017-synthesized-voice
          path: narration/
          retention-days: 3
      - name: Verify transcript and measure words
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(Path('narration').glob('*.wav')):
              segs,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              data={'file':p.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segs]}
              p.with_name(p.stem+'_words.json').write_text(json.dumps(data,ensure_ascii=False,indent=2));print(p.name,[s['text'] for s in data['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p017-voice-with-timings
          path: narration/
          retention-days: 3
