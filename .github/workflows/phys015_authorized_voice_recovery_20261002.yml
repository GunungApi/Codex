name: PHYS015 approved narration refinement
on:
  push:
    paths: ['.github/workflows/phys015_authorized_voice_recovery_20261002.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve revised commissioned audio and Japanese word times
        run: |
          python -m pip -q install playwright requests av faster-whisper
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p refined
          python - <<'PY'
          from pathlib import Path
          import requests,json,urllib.parse,hashlib,av
          from playwright.sync_api import sync_playwright
          from faster_whisper import WhisperModel
          # Explicit owner approval; public commissioned playback pages only, no credentials.
          pages={'02':'0fd05c2cc73d4ff7b3dacc2118079767','03':'1c2b9b5bf13e41e8b4704183b0390ac9','04':'a760082494264e339bbb8c32d8cabb78','05':'2705bdde9ff244b9ab7edbcfffb6eab4'}
          records=[]
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              for number,cid in pages.items():
                  page=browser.new_page()
                  page.goto('https://www.aidocmaker.com/g0/audio?name='+cid,wait_until='domcontentloaded',timeout=90000)
                  sources=[]
                  for attempt in range(65):
                      sources=page.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                      if sources:break
                      page.wait_for_timeout(1000)
                  assert sources,'No playable source for '+number
                  src=sources[0];u=urllib.parse.urlparse(src);assert u.scheme=='https' and u.netloc=='storage.googleapis.com'
                  print('::add-mask::'+src)
                  r=requests.get(src,timeout=60);r.raise_for_status();p=Path('refined',number+'.mp3');p.write_bytes(r.content)
                  a=av.open(str(p));duration=a.duration/av.time_base;frames=sum(1 for x in a.decode(audio=0));assert 2<duration<30 and frames>10
                  records.append({'file':p.name,'duration':duration,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size,'decoded_frames':frames})
                  page.close()
              browser.close()
          Path('refined/retrieval_refined.json').write_text(json.dumps(records,indent=2))
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(Path('refined').glob('*.mp3')):
              seg,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              d={'file':p.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in seg]}
              p.with_name(p.stem+'_words.json').write_text(json.dumps(d,ensure_ascii=False,indent=2));print(p.name,info.duration,[s['text'] for s in d['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phys015-refined-narration
          path: refined/
          retention-days: 2
