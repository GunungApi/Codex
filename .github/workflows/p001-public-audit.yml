name: P001 public video audit
on:
  push:
    branches: [repair/p001-public-audit-20260919]
    paths: [.github/workflows/p001-public-audit.yml]
permissions: {}
jobs:
  public-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public YouTube metadata only
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, xml.etree.ElementTree as ET, json, re, datetime
          channel='UC_pRLA4rha9VmBuQFeEk8zg'
          urls=[f'https://www.youtube.com/feeds/videos.xml?channel_id={channel}',f'https://www.youtube.com/channel/{channel}/shorts?hl=ja']
          report={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'channel':channel,'authenticated':False,'youtube_writes':False,'results':[]}
          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values():yield from walk(v)
              elif isinstance(x,list):
                  for v in x:yield from walk(v)
          def text(x):
              if isinstance(x,str):return x
              if isinstance(x,dict):return x.get('simpleText') or x.get('content') or ''.join(v.get('text','') for v in x.get('runs',[]))
              return ''
          for url in urls:
              item={'url':url}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ja,en;q=0.8'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read(12000000).decode('utf-8','replace');item.update(status=r.status,bytes=len(raw))
                  videos=[]
                  if '<feed' in raw[:2000]:
                      root=ET.fromstring(raw)
                      ns={'a':'http://www.w3.org/2005/Atom','yt':'http://www.youtube.com/xml/schemas/2015'}
                      for e in root.findall('a:entry',ns):
                          videos.append({'videoId':e.findtext('yt:videoId',default='',namespaces=ns),'title':e.findtext('a:title',default='',namespaces=ns),'published':e.findtext('a:published',default='',namespaces=ns)})
                  else:
                      m=re.search(r'(?:var\s+ytInitialData\s*=|window\["ytInitialData"\]\s*=|ytInitialData\s*=)\s*',raw)
                      if m:
                          data,_=json.JSONDecoder().raw_decode(raw[m.end():])
                          seen=set()
                          for node in walk(data):
                              for key in ['videoRenderer','gridVideoRenderer','reelItemRenderer','shortsLockupViewModel']:
                                  v=node.get(key)
                                  if not isinstance(v,dict):continue
                                  vid=v.get('videoId')
                                  if not vid:
                                      for d in walk(v):
                                          if isinstance(d.get('videoId'),str):vid=d['videoId'];break
                                  if not vid or vid in seen:continue
                                  seen.add(vid)
                                  title=text(v.get('title')) or text(v.get('headline')) or text(v.get('overlayMetadata',{}).get('primaryText'))
                                  videos.append({'videoId':vid,'title':title,'views':text(v.get('viewCountText')) or text(v.get('overlayMetadata',{}).get('secondaryText'))})
                          meta=data.get('metadata',{}).get('channelMetadataRenderer',{})
                          item['channel_metadata']={k:meta.get(k) for k in ['title','externalId','vanityChannelUrl'] if k in meta}
                      item['raw_video_ids']=list(dict.fromkeys(re.findall(r'"videoId"\s*:\s*"([A-Za-z0-9_-]{11})"',raw)))[:50]
                      if not videos:item['page_title']=re.findall(r'<title>(.*?)</title>',raw,re.S)[:1]
                  item['videos']=videos[:40]
              except urllib.error.HTTPError as e:item.update(error_type='HTTPError',status=e.code,error=str(e))
              except Exception as e:item.update(error_type=type(e).__name__,error=str(e))
              report['results'].append(item)
          print('PUBLIC_AUDIT_REPORT_START')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          print('PUBLIC_AUDIT_REPORT_END')
          PY
