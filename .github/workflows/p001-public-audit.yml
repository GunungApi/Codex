name: P001 public video audit
on:
  push:
    branches: [repair/p001-public-audit-20260919]
    paths: [.github/workflows/p001-public-audit.yml]
permissions: {}
jobs:
  public-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify identified public videos only
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, re, datetime, hashlib
          ids=['qdqtUXcS7dc','dNIdOnTE3_4']
          report={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'authenticated':False,'youtube_writes':False,'videos':[]}
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ja,en;q=0.8'})
              with urllib.request.urlopen(req,timeout=25) as r:return r.status,r.read(14000000)
          for vid in ids:
              v={'videoId':vid}
              try:
                  status,raw=get('https://www.youtube.com/watch?v='+vid+'&hl=ja')
                  s=raw.decode('utf8','replace');v.update(http_status=status,page_bytes=len(raw))
                  m=re.search(r'(?:var\s+ytInitialPlayerResponse\s*=|ytInitialPlayerResponse\s*=)\s*',s)
                  if m:
                      p,_=json.JSONDecoder().raw_decode(s[m.end():])
                      d=p.get('videoDetails',{})
                      v['details']={k:d.get(k) for k in ['videoId','title','channelId','author','lengthSeconds','isPrivate','viewCount','shortDescription'] if k in d}
                      f=p.get('microformat',{}).get('playerMicroformatRenderer',{})
                      v['microformat']={k:f.get(k) for k in ['uploadDate','publishDate','isUnlisted','ownerChannelName','externalChannelId'] if k in f}
                      v['playability']=p.get('playabilityStatus',{}).get('status')
                      fs=p.get('streamingData',{})
                      v['formats']=[{k:z.get(k) for k in ['itag','mimeType','width','height','fps','qualityLabel','bitrate'] if k in z} for z in fs.get('formats',[])+fs.get('adaptiveFormats',[])]
                  else:v['parse_error']='No initial player response'
                  status,thumb=get('https://i.ytimg.com/vi/'+vid+'/hqdefault.jpg')
                  v['thumbnail']={'status':status,'bytes':len(thumb),'sha256':hashlib.sha256(thumb).hexdigest()}
              except Exception as e:v['error']=str(e)
              report['videos'].append(v)
          print('PUBLIC_VERIFY_REPORT_START')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          print('PUBLIC_VERIFY_REPORT_END')
          PY
