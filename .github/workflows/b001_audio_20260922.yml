name: B001 narration retrieval 20260922
on:
  push:
    paths: ['.github/workflows/b001_audio_20260922.yml']
permissions:
  contents: read
  actions: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: b001-private-transfer-key
          path: private
          run-id: 35629230020
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover authorized narration files without exposing temporary locators
        run: |
          python -m pip install cryptography faster-whisper numpy astropy healpy
          python - <<'PY'
          import json,base64,pathlib,urllib.request,hashlib,subprocess
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          key=serialization.load_pem_private_key(pathlib.Path('private/key.pem').read_bytes(),password=None)
          encrypted=["","","","","","",""]
          out=pathlib.Path('audio');out.mkdir()
          report=[]
          for i,enc in enumerate(encrypted,1):
              url=key.decrypt(base64.b64decode(enc),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode()
              print('::add-mask::'+url,flush=True)
              try:
                  with urllib.request.urlopen(url,timeout=60) as r: data=r.read()
              except Exception: raise RuntimeError('Narration download failed for segment '+str(i)) from None
              p=out/f'{i:02d}.mp3';p.write_bytes(data)
              report.append({'segment':i,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (out/'download_validation.json').write_text(json.dumps(report,indent=2))
          pathlib.Path('private/key.pem').unlink()
          print('Recovered',len(report),'narration files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b001-narration-originals
          path: audio/
          retention-days: 1
          if-no-files-found: error
      - name: Align actual spoken words
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          import pathlib,json
          model=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          out=pathlib.Path('alignment');out.mkdir()
          for p in sorted(pathlib.Path('audio').glob('*.mp3')):
              segments,info=model.transcribe(str(p),language='ja',beam_size=5,word_timestamps=True,vad_filter=False)
              rows=[]
              for s in segments:
                  rows.append({'start':s.start,'end':s.end,'text':s.text,'words':[{'word':w.word,'start':w.start,'end':w.end,'probability':w.probability} for w in (s.words or [])]})
              (out/(p.stem+'.json')).write_text(json.dumps({'duration':info.duration,'segments':rows},ensure_ascii=False,indent=2))
              print(p.stem,' '.join(x['text'] for x in rows),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b001-aligned-words
          path: alignment/
          retention-days: 1
          if-no-files-found: error
      - name: Additional observed foreground example
        run: |
          python - <<'PY'
          import urllib.request,pathlib,json,hashlib
          import numpy as np,healpy as hp
          from astropy.io import fits
          out=pathlib.Path('foreground');out.mkdir()
          url='https://lambda.gsfc.nasa.gov/data/map/dr5/skymaps/9yr/smoothed/wmap_band_smth_iqumap_r9_9yr_K_v5.fits'
          p=out/'kband.fits'
          with urllib.request.urlopen(url,timeout=90) as r: p.write_bytes(r.read())
          with fits.open(p) as h:
              a=np.asarray(h[1].data.field(0),dtype=float).flatten()
              unit=h[1].header.get('TUNIT1','unknown'); ordering=h[1].header.get('ORDERING','NESTED')
          l,b=np.meshgrid(np.linspace(-np.pi,np.pi,2048,endpoint=False),np.linspace(np.pi/2,-np.pi/2,1024))
          image=hp.get_interp_val(a,np.pi/2-b,l%(2*np.pi),nest=ordering.strip().upper()=='NESTED')
          np.save(out/'kband_latlon.npy',image.astype('float32'))
          (out/'metadata.json').write_text(json.dumps({'source':url,'unit':unit,'ordering':ordering,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()},indent=2))
          p.unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b001-foreground-data
          path: foreground/
          retention-days: 1
          if-no-files-found: error
