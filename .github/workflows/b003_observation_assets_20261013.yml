name: B003 licensed observation assets
on:
  push:
    paths: ['.github/workflows/b003_observation_assets_20261013.yml']
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve original credited observation images
        run: |
          python -m pip -q install requests pillow
          mkdir -p observations
          python - <<'PY'
          from pathlib import Path
          import requests,hashlib,json
          from PIL import Image
          records=[]
          for ident,credit in [('eso1436a','ALMA (ESO/NAOJ/NRAO)'),('potw2534a','ESO/R. F. van Capelleveen et al.')]:
              url=f'https://www.eso.org/public/archives/images/large/{ident}.jpg'
              r=requests.get(url,timeout=60);r.raise_for_status();p=Path('observations',ident+'.jpg');p.write_bytes(r.content)
              im=Image.open(p);im.load();assert min(im.size)>=1000
              records.append({'file':p.name,'url':url,'source_page':f'https://www.eso.org/public/images/{ident}/','credit':credit,'license':'Creative Commons Attribution 4.0 International','license_policy':'https://www.eso.org/public/outreach/copyright/','sha256':hashlib.sha256(r.content).hexdigest(),'size':im.size})
          Path('observations/credits.json').write_text(json.dumps(records,ensure_ascii=False,indent=2));print(records)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b003-licensed-observations
          path: observations/
          retention-days: 3
