name: P010 protected narration and word alignment
on:
  push:
    paths: ['.github/workflows/p010_voice_20260922.yml']
permissions:
  contents: read
  actions: read
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: vhaven-transfer-key
          path: private
          run-id: 35710149644
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover four synthetic narration clips
        run: |
          python -m pip install requests cryptography faster-whisper
          python - <<'PY'
          import pathlib,base64,requests,uuid,json,hashlib,av
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          key=serialization.load_pem_private_key(pathlib.Path('private/key.pem').read_bytes(),password=None)
          encrypted=''
          ids=key.decrypt(base64.b64decode(encrypted),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode().split('|')
          assert len(ids)==4
          out=pathlib.Path('media');out.mkdir();report=[]
          for i,item in enumerate(ids,1):
              assert str(uuid.UUID(item))==item
              url='https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/'+item+'.mp3'
              print('::add-mask::'+url)
              r=requests.get(url,timeout=45,allow_redirects=False);r.raise_for_status()
              assert 2000<len(r.content)<10000000
              p=out/f'{i:02}.mp3';p.write_bytes(r.content)
              with av.open(str(p)) as c:
                  fs=list(c.decode(audio=0)); assert fs
                  sr=fs[0].sample_rate; samples=sum(f.samples for f in fs)
              report.append({'clip':i,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'sample_rate':sr,'decoded_duration':samples/sr})
          (out/'recovery.json').write_text(json.dumps(report,indent=2))
          print('All four clips recovered and decoded')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p010-narration-originals
          path: media/
          retention-days: 7
          if-no-files-found: error
      - name: Japanese word timing and pronunciation reference
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          import pathlib,json
          model=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          out=pathlib.Path('alignment');out.mkdir()
          for p in sorted(pathlib.Path('media').glob('*.mp3')):
              segments,info=model.transcribe(str(p),language='ja',beam_size=5,word_timestamps=True,vad_filter=False,condition_on_previous_text=False)
              data=[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in (s.words or [])]} for s in segments]
              (out/(p.stem+'.json')).write_text(json.dumps(data,ensure_ascii=False,indent=2))
              print(p.stem,' '.join(s['text'] for s in data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p010-word-alignment
          path: alignment/
          retention-days: 7
          if-no-files-found: error
