name: Astragen original voice recovery
on:
  push:
    paths: ['.github/workflows/astragen_voice_20260928.yml']
permissions:
  contents: read
  actions: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: astragen-transfer-key
          path: private
          run-id: 36379907065
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover generated original audio
        env:
          ENCRYPTED_PAGE: 
        run: |
          python -m pip -q install cryptography playwright requests av
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p voice
          python - <<'PY'
          import os,base64,json,hashlib,pathlib,time,urllib.parse
          import requests,av
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from playwright.sync_api import sync_playwright
          key=serialization.load_pem_private_key(pathlib.Path('private/key.pem').read_bytes(),None)
          url=key.decrypt(base64.b64decode(os.environ['ENCRYPTED_PAGE']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode()
          assert url.startswith('https://www.aidocmaker.com/g0/audio?name=')
          print('::add-mask::'+url)
          candidates=[]
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              page=browser.new_page()
              def seen(response):
                  c=response.headers.get('content-type','')
                  if c.startswith('audio/') or '.mp3' in response.url:
                      candidates.append(response.url)
              page.on('response',seen)
              page.goto(url,wait_until='domcontentloaded',timeout=90000)
              for _ in range(40):
                  candidates.extend(page.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)'))
                  if candidates:break
                  page.wait_for_timeout(1000)
              assert candidates,'No audio resource exposed by the playback page'
              saved=False
              for src in dict.fromkeys(candidates):
                  print('::add-mask::'+src)
                  p=urllib.parse.urlparse(src)
                  if p.scheme!='https' or not (p.netloc=='storage.googleapis.com' or p.netloc.endswith('.aidocmaker.com')):continue
                  r=requests.get(src,timeout=60);r.raise_for_status()
                  if len(r.content)>30000000:continue
                  out=pathlib.Path('voice/original.mp3');out.write_bytes(r.content)
                  try:
                      a=av.open(str(out));dur=a.duration/av.time_base
                      frames=sum(1 for _ in a.decode(audio=0))
                  except Exception:continue
                  assert dur>30 and frames>20
                  pathlib.Path('voice/retrieval.json').write_text(json.dumps({'duration':dur,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'decoded_audio_frames':frames,'method':'Authorized playback page and original exposed audio resource; encrypted transfer input'},indent=2))
                  print('Recovered original audio:',dur,'seconds',len(r.content),'bytes');saved=True;break
              browser.close()
              assert saved,'Exposed resources did not yield full decodable audio'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astragen-original-voice
          path: voice/
          retention-days: 1
      - name: Align Japanese original narration
        run: |
          python -m pip -q install faster-whisper
          python - <<'PY'
          import json,pathlib
          from faster_whisper import WhisperModel
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          seg,info=model.transcribe('voice/original.mp3',language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
          result={'model':'large-v3-turbo','duration':info.duration,'segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in seg]}
          pathlib.Path('voice/alignment.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print('\n'.join(s['text'] for s in result['segments']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astragen-aligned-voice
          path: voice/
          retention-days: 1
