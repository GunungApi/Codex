name: MUUH002 v3 final comparison voice
on:
  push:
    paths: ['.github/workflows/muuh002_v3_finish_voice_20260922.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install playback and speech tools
        run: |
          python -m pip install playwright faster-whisper
          python -m playwright install --with-deps chromium
      - name: Download the existing generated narration via public playback
        run: |
          python - <<'PY'
          import pathlib,json,urllib.parse,hashlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('audio');out.mkdir()
          items={'earth_structure_fix':'b1927ea8452042f694a220cfb36e5ee2','nerve_compare':'2a2722dcfb794c0d915b1665aac86a09'}
          records=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for name,cid in items.items():
                  page=browser.new_page()
                  page.goto('https://www.aidocmaker.com/g0/audio?name='+cid,wait_until='networkidle',timeout=60000)
                  page.wait_for_timeout(3500)
                  sources=page.locator('audio,video,source').evaluate_all('(els)=>els.map(e=>e.currentSrc||e.src).filter(Boolean)')
                  found=False
                  for url in sources:
                      u=urllib.parse.urlparse(url)
                      if u.scheme!='https' or not (u.hostname=='storage.googleapis.com' or u.hostname.endswith('aidocmaker.com')):continue
                      r=page.request.get(url)
                      assert r.ok
                      data=r.body()
                      if 5000<len(data)<10000000:
                          (out/(name+'.mp3')).write_bytes(data)
                          records.append({'name':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()});found=True;break
                  assert found,'Audio not present in public playback'
                  page.close()
              browser.close()
          (out/'retrieval.json').write_text(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: muuh002-v3-final-voice-originals
          path: audio/
          retention-days: 2
      - name: Check Japanese word timings and pronunciation-sensitive terms
        run: |
          python - <<'PY'
          from pathlib import Path
          from faster_whisper import WhisperModel
          import json
          model=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          out=Path('aligned');out.mkdir()
          for p in Path('audio').glob('*.mp3'):
              segments,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              result={'duration':info.duration,'segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segments]}
              (out/(p.stem+'.json')).write_text(json.dumps(result,ensure_ascii=False,indent=2))
              print(p.name,[(s['start'],s['end'],s['text']) for s in result['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: muuh002-v3-final-voice-times
          path: aligned/
          retention-days: 2
