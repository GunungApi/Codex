name: PHYS016 barycenter narration
on:
  push:
    paths: ['.github/workflows/phys016_barycenter_voice_20261003.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve commissioned audio and word timing
        run: |
          python -m pip -q install playwright requests av faster-whisper
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p narration
          python - <<'PY'
          from pathlib import Path
          import requests,json,urllib.parse,hashlib,av
          from playwright.sync_api import sync_playwright
          from faster_whisper import WhisperModel
          # Durable playback identifiers of the commissioned public narration only.
          # Temporary signed media URLs are masked and are never saved.
          pages={'01':'ab68aab9494245089b5ba0a45bd02f39','02':'b1b920ff2e1349e7b77257aed64f96f0','03':'6fc46e210ecd4638a7bad5ed57bcc216','04':'f9bcd250837041989f9b4509fa870104','05':'a6f793e3fdca4faa80d5ee979e376a8e','06':'e3e08f9b11854eec8177675595184ed7'}
          records=[]
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              for number,cid in pages.items():
                  page=browser.new_page()
                  page.goto('https://www.aidocmaker.com/g0/audio?name='+cid,wait_until='domcontentloaded',timeout=90000)
                  sources=[]
                  for attempt in range(65):
                      sources=page.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                      if sources:break
                      page.wait_for_timeout(1000)
                  assert sources,'No playable source for '+number
                  src=sources[0];u=urllib.parse.urlparse(src)
                  assert u.scheme=='https' and u.netloc=='storage.googleapis.com'
                  print('::add-mask::'+src)
                  response=requests.get(src,timeout=60);response.raise_for_status()
                  p=Path('narration',number+'.mp3');p.write_bytes(response.content)
                  a=av.open(str(p));duration=a.duration/av.time_base;frames=sum(1 for f in a.decode(audio=0))
                  assert 2<duration<30 and frames>10
                  records.append({'file':p.name,'duration':duration,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'decoded_frames':frames})
                  page.close()
              browser.close()
          Path('narration/retrieval.json').write_text(json.dumps(records,indent=2))
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(Path('narration').glob('*.mp3')):
              segments,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              d={'file':p.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segments]}
              p.with_name(p.stem+'_words.json').write_text(json.dumps(d,ensure_ascii=False,indent=2))
              print(p.name,info.duration,[s['text'] for s in d['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phys016-narration-v1
          path: narration/
          retention-days: 2
