name: VAH pronunciation crosscheck
on:
  push:
    paths: ['.github/workflows/vah-speech-check-20260920.yml']
permissions:
  actions: read
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests faster-whisper
      - name: Check recovered original
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,requests,io,zipfile,pathlib,json
          from faster_whisper import WhisperModel
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          r=requests.get('https://api.github.com/repos/'+os.environ['REPO']+'/actions/artifacts/10595334494/zip',headers=h,timeout=90);r.raise_for_status()
          zipfile.ZipFile(io.BytesIO(r.content)).extractall('voice')
          m=WhisperModel('large-v3',device='cpu',compute_type='int8',cpu_threads=4)
          ss,info=m.transcribe('voice/01.mp3',language='ja',word_timestamps=True,beam_size=5,vad_filter=True)
          out=[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in (s.words or [])]} for s in ss]
          pathlib.Path('review').mkdir();pathlib.Path('review/large_v3_check.json').write_text(json.dumps(out,ensure_ascii=False,indent=2));print([s['text'] for s in out],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vah-pronunciation-check
          path: review/
          retention-days: 1
