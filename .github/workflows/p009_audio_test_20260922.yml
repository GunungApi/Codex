name: P009 single audio retrieval test
on:
  push:
    paths: ['.github/workflows/p009_audio_test_20260922.yml']
permissions:
  contents: read
  actions: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: p009-transfer-key
          path: private
          run-id: 35651659079
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Retrieve generated synthetic narration only
        run: |
          python -m pip install cryptography requests
          python - <<'PY'
          import pathlib,base64,requests,urllib.parse
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          key=serialization.load_pem_private_key(pathlib.Path('private/key.pem').read_bytes(),password=None)
          encrypted=''
          url=key.decrypt(base64.b64decode(encrypted),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode()
          p=urllib.parse.urlparse(url)
          assert p.scheme=='https' and p.netloc=='storage.googleapis.com' and p.path.startswith('/adm--audio-playback--7d--public/mcp-preview/') and p.path.endswith('.mp3')
          print('::add-mask::'+url)
          r=requests.get(url,timeout=45,allow_redirects=False);r.raise_for_status()
          assert len(r.content)<10000000
          pathlib.Path('audio').mkdir()
          pathlib.Path('audio/01.mp3').write_bytes(r.content)
          print('Generated audio bytes:',len(r.content))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p009-audio-test
          path: audio/
          retention-days: 7
          if-no-files-found: error
