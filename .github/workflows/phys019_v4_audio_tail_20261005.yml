name: PHYS019 v4 sentence ending repair
on:
  push:
    paths: ['.github/workflows/phys019_v4_audio_tail_20261005.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve commissioned sentence and timing
        run: |
          python -m pip -q install playwright requests av faster-whisper
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p repair/audio repair/wheels
          python -m pip download --only-binary=:all: --no-deps --python-version 313 --abi cp313 --platform manylinux2014_x86_64 -d repair/wheels moderngl==5.12.0 glcontext==3.0.0
          python - <<'PY'
          from pathlib import Path
          import requests,json,urllib.parse,hashlib,av
          from playwright.sync_api import sync_playwright
          from faster_whisper import WhisperModel
          # A sentence commissioned for the owner's existing film. No credentials are needed.
          with sync_playwright() as pw:
              b=pw.chromium.launch(headless=True);p=b.new_page()
              p.goto('https://www.aidocmaker.com/g0/audio?name=e228732815864add98c67acb88faa8bc',wait_until='domcontentloaded',timeout=90000)
              sources=[]
              for attempt in range(65):
                  sources=p.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                  if sources:break
                  p.wait_for_timeout(1000)
              assert sources,'No playable commissioned audio'
              u=urllib.parse.urlparse(sources[0]);assert u.scheme=='https' and u.netloc=='storage.googleapis.com'
              print('::add-mask::'+sources[0])
              r=requests.get(sources[0],timeout=60);r.raise_for_status()
              f=Path('repair/audio/02_replacement_sentence.mp3');f.write_bytes(r.content)
              a=av.open(str(f));duration=a.duration/av.time_base;frames=sum(1 for _ in a.decode(audio=0))
              assert 1.5<duration<20 and frames>10
              b.close()
          Path('repair/audio/retrieval.json').write_text(json.dumps({'file':f.name,'duration':duration,'decoded_frames':frames,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest()},indent=2))
          m=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          seg,info=m.transcribe(str(f),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
          d={'file':f.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in seg]}
          Path('repair/audio/02_replacement_words.json').write_text(json.dumps(d,ensure_ascii=False,indent=2))
          print('Decoded duration',duration,'Transcript',[s['text'] for s in d['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phys019-v4-sentence-repair
          path: repair/
          retention-days: 7
