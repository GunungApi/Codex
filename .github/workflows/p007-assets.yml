name: P007 production asset recovery
on:
  push:
    branches: [production/p007-20260921]
    paths: [.github/workflows/p007-assets.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Receive encrypted audio locations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p voice wheels
          python3 - <<'PY'
          import os,json,base64,hashlib,time,pathlib,subprocess,urllib.request,urllib.parse,urllib.error
          root='https://api.github.com/repos/'+os.environ['GH_REPO']+'/contents/workbench/p007/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          branch=os.environ['GH_BRANCH']
          def get(name):
              req=urllib.request.Request(root+name+'?ref='+urllib.parse.quote(branch,safe=''),headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          def put(name,text):
              body={'message':'P007 ephemeral public exchange key','branch':branch,'content':base64.b64encode(text.encode()).decode()}
              try:body['sha']=get(name)['sha']
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
              req=urllib.request.Request(root+name,data=json.dumps(body).encode(),headers=headers,method='PUT')
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          key=pathlib.Path('/tmp/p007-private.pem')
          subprocess.run(['openssl','genpkey','-algorithm','RSA','-pkeyopt','rsa_keygen_bits:4096','-out',str(key)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          os.chmod(key,0o600)
          pub=subprocess.check_output(['openssl','pkey','-in',str(key),'-pubout']).decode()
          keyid=hashlib.sha256(pub.encode()).hexdigest()
          put('public_key.json',json.dumps({'pem':pub,'key_sha256':keyid,'run_id':os.environ['RUN_ID']}))
          print('Public exchange key ready; private key remains only on this runner.',flush=True)
          payload=None
          for _ in range(120):
              try:
                  obj=get('encrypted_payload.json')
                  candidate=json.loads(base64.b64decode(obj['content']))
                  if candidate.get('key_sha256')==keyid:
                      payload=candidate;break
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
              time.sleep(5)
          if payload is None:raise RuntimeError('Encrypted input not received before timeout')
          try:
              manifest=[]
              for item in payload['items']:
                  name=item['name']
                  if name not in ['01.mp3','02.mp3','03.mp3','04.mp3']:raise ValueError('Unexpected output name')
                  sealed=base64.b64decode(item['sealed_url'])
                  url=subprocess.check_output(['openssl','pkeyutl','-decrypt','-inkey',str(key),'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],input=sealed).decode()
                  p=urllib.parse.urlparse(url)
                  if p.scheme!='https' or p.hostname!='storage.googleapis.com':raise ValueError('Unexpected audio host')
                  data=None
                  for attempt in range(3):
                      try:
                          with urllib.request.urlopen(url,timeout=60) as r:
                              data=r.read(15000001)
                          if not 1000<len(data)<15000000:raise ValueError('Invalid audio size')
                          break
                      except Exception:
                          if attempt==2:raise RuntimeError('Audio recovery failed') from None
                          time.sleep(2)
                  pathlib.Path('voice',name).write_bytes(data)
                  manifest.append({'name':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              pathlib.Path('voice/recovery.json').write_text(json.dumps({'run_id':os.environ['RUN_ID'],'files':manifest,'method':'RSA-OAEP encrypted handoff; no plaintext audio URL committed'},indent=2))
          finally:
              key.unlink(missing_ok=True)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch compatible render packages
        run: python -m pip download --only-binary=:all: --dest wheels moderngl glcontext
      - uses: actions/upload-artifact@v4
        with:
          name: p007-raw-and-render-packages
          path: |
            voice/*.mp3
            voice/recovery.json
            wheels/*
          retention-days: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Align Japanese narration to actual audio
        run: |
          python -m pip install --quiet faster-whisper
          python - <<'PY'
          import pathlib,json
          from faster_whisper import WhisperModel
          model=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          out={}
          for file in sorted(pathlib.Path('voice').glob('*.mp3')):
              segments,info=model.transcribe(str(file),language='ja',beam_size=5,word_timestamps=True,vad_filter=False,condition_on_previous_text=False)
              out[file.name]={'duration':info.duration,'language_probability':info.language_probability,'segments':[]}
              for s in segments:
                  out[file.name]['segments'].append({'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in (s.words or [])]})
              print(file.name,out[file.name]['duration'],flush=True)
          pathlib.Path('voice/alignment.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p007-audio-alignment
          path: voice/alignment.json
          retention-days: 1
      - name: Remove transient private files
        if: always()
        run: rm -f /tmp/p007-private.pem
