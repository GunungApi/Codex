name: MUUH002 narration recovery
on:
  push:
    paths: ['.github/workflows/muuh002_audio_20260922.yml']
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: muuh002-transfer-key
          run-id: 35674676179
          github-token: ${{ github.token }}
          path: private
      - name: Install narration verification tools
        run: python -m pip -q install cryptography faster-whisper
      - name: Recover and inspect audio without logging temporary URLs
        shell: python
        run: |
          import base64, json, pathlib, urllib.request, hashlib
          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives import hashes
          from faster_whisper import WhisperModel
          encrypted = ["", "", "", "", ""]
          key = load_pem_private_key(pathlib.Path('private/key.pem').read_bytes(), password=None)
          out=pathlib.Path('audio');out.mkdir()
          manifest=[]
          for i,e in enumerate(encrypted,1):
              u=key.decrypt(base64.b64decode(e),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode()
              try:
                  data=urllib.request.urlopen(u,timeout=60).read()
              except Exception:
                  raise RuntimeError('Narration download failed for segment '+str(i)) from None
              assert len(data)>5000
              f=out/f'{i:02}.mp3';f.write_bytes(data)
              manifest.append({'segment':i,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          pathlib.Path('private/key.pem').unlink()
          model=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          for i in range(1,6):
              segs,info=model.transcribe(str(out/f'{i:02}.mp3'),language='ja',beam_size=5,word_timestamps=True,initial_prompt='ムー族、リプル、細胞、炭化水素、支柱、関節、板、筋肉、神経、彫刻。')
              rows=[]
              for s in segs:
                  rows.append({'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]})
              (out/f'{i:02}.json').write_text(json.dumps({'duration':info.duration,'segments':rows},ensure_ascii=False,indent=2))
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print('Recovered and decoded all five narration segments.')
      - uses: actions/upload-artifact@v4
        with:
          name: muuh002-narration
          path: audio/
          retention-days: 3
