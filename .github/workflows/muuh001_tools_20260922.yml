name: MUUH001 private transfer and renderer tools
on:
  push:
    paths: ['.github/workflows/muuh001_tools_20260922.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare offline renderer and private transfer key
        run: |
          mkdir -p out/wheels private
          python -m pip download --only-binary=:all: --dest out/wheels moderngl glcontext
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out private/key.pem 2>/dev/null
          chmod 600 private/key.pem
          openssl pkey -in private/key.pem -pubout -out out/transfer_public.pem
          python -VV > out/python_version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: muuh001-offline-renderer-tools
          path: out/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: muuh001-private-transfer-key
          path: private/
          retention-days: 1
          if-no-files-found: error
