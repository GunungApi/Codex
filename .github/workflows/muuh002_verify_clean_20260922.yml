name: MUUH002 verification and scoped transfer cleanup
on:
  push:
    paths: ['.github/workflows/muuh002_verify_clean_20260922.yml']
permissions:
  contents: read
  actions: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: muuh002-narration
          run-id: 35674865250
          github-token: ${{ github.token }}
          path: audio
      - run: python -m pip -q install faster-whisper
      - name: Independently recognize terminology in the second segment
        shell: python
        run: |
          import pathlib,json
          from faster_whisper import WhisperModel
          m=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          rows,info=m.transcribe('audio/02.mp3',language='ja',beam_size=7,word_timestamps=True)
          result=[]
          for s in rows:
              result.append({'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word} for w in s.words]})
          pathlib.Path('verification').mkdir()
          pathlib.Path('verification/segment02_medium_asr.json').write_text(json.dumps({'model':'medium','prompt':None,'segments':result},ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False))
      - uses: actions/upload-artifact@v4
        with:
          name: muuh002-narration-verification
          path: verification/
          retention-days: 2
      - name: Delete only the completed MUUH002 temporary transfer-key artifact
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.deleteArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:10672014290});
            core.info('MUUH002 transfer key artifact removed.');
