name: P005 corrected production voice
on:
  push:
    branches: [p005-assets-20260920]
    paths: [.github/workflows/p005-assets.yml]
permissions:
  contents: read
  actions: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: p005-original-voice
          run-id: 35482799350
          github-token: ${{ github.token }}
          path: assets
      - name: Prepare transient receiver
        run: |
          mkdir -p bootstrap
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/p005_private.pem 2>/dev/null
          openssl pkey -in /tmp/p005_private.pem -pubout -out bootstrap/public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: p005-bootstrap-v3
          path: bootstrap/
          retention-days: 1
      - name: Recover corrected voice originals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip -q install cryptography requests faster-whisper
          python - <<'PY'
          import os,time,json,base64,requests,av
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          key=serialization.load_pem_private_key(Path('/tmp/p005_private.pem').read_bytes(),password=None)
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/p005_encrypted_input_v3.json"
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          for trial in range(160):
              r=requests.get(url,params={'ref':os.environ['GITHUB_REF_NAME']},headers=headers,timeout=20)
              if r.status_code==200: break
              time.sleep(5)
          else: raise RuntimeError('No corrected encrypted inputs received')
          entries=json.loads(base64.b64decode(r.json()['content']))
          for e in entries:
              link=key.decrypt(base64.b64decode(e['encrypted_url']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode()
              response=requests.get(link,timeout=120)
              if response.status_code!=200:raise RuntimeError('Audio retrieval failed')
              path=Path('assets/voice')/e['file'];path.write_bytes(response.content)
              with av.open(str(path)) as c: sample_count=sum(f.samples for f in c.decode(audio=0))
              if sample_count<1000:raise RuntimeError('Incomplete audio')
              print('Recovered',e['file'],sample_count,'samples',flush=True)
          Path('/tmp/p005_private.pem').unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p005-corrected-originals
          path: assets/
          retention-days: 1
      - name: Independent recognition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel
          p=Path('assets')
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          result=[]
          for e in json.loads((p/'scripts.json').read_text()):
              segs,info=model.transcribe(str(p/'voice'/e['file']),language='ja',word_timestamps=True,beam_size=5,condition_on_previous_text=False,initial_prompt=None,vad_filter=False)
              record={**e,'segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segs]}
              result.append(record)
              print(e['file'],''.join(s['text'] for s in record['segments']),flush=True)
          (p/'independent_transcription.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p005-final-voice
          path: assets/
          retention-days: 1
