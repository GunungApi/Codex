name: P005 production assets
on:
  push:
    branches: [p005-assets-20260920]
    paths: [.github/workflows/p005-assets.yml]
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare transient receiver and renderer dependencies
        run: |
          mkdir -p bootstrap assets/voice
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/p005_private.pem 2>/dev/null
          openssl pkey -in /tmp/p005_private.pem -pubout -out bootstrap/public.pem
          python -m pip download --dest bootstrap --only-binary=:all: --no-deps --python-version 313 --abi cp313 --platform manylinux2014_x86_64 moderngl glcontext
      - uses: actions/upload-artifact@v4
        with:
          name: p005-bootstrap
          path: bootstrap/
          retention-days: 1
      - name: Retrieve authorized voice assets without logging temporary links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip -q install cryptography requests faster-whisper
          python - <<'PY'
          import os,time,json,base64,requests,subprocess
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          key=serialization.load_pem_private_key(Path('/tmp/p005_private.pem').read_bytes(),password=None)
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/p005_encrypted_input.json"
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          for trial in range(160):
              r=requests.get(url,params={'ref':os.environ['GITHUB_REF_NAME']},headers=headers,timeout=20)
              if r.status_code==200: break
              time.sleep(5)
          else: raise RuntimeError('No encrypted production inputs received')
          entries=json.loads(base64.b64decode(r.json()['content']))
          from faster_whisper import WhisperModel
          model=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          records=[]
          for e in entries:
              link=key.decrypt(base64.b64decode(e['encrypted_url']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode()
              response=requests.get(link,timeout=120);response.raise_for_status()
              path=Path('assets/voice')/e['file'];path.write_bytes(response.content)
              subprocess.run(['ffmpeg','-v','error','-i',str(path),'-f','null','-'],check=True)
              segs,info=model.transcribe(str(path),language='ja',word_timestamps=True,beam_size=5,initial_prompt=e['transcript'])
              records.append({'file':e['file'],'script':e['transcript'],'segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segs]})
              print('Validated and transcribed',e['file'],len(response.content),'bytes',flush=True)
          Path('assets/transcription.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          Path('/tmp/p005_private.pem').unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p005-voice-aligned
          path: assets/
          retention-days: 1
