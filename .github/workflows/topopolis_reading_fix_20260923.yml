name: Topopolis opening pronunciation verification
on:
  push:
    paths: ['.github/workflows/topopolis_reading_fix_20260923.yml']
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: topopolis-transfer-key
          path: private
          run-id: 35770485655
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          python -m pip install --quiet cryptography requests faster-whisper
          python - <<'PY'
          import pathlib,base64,requests,json,urllib.parse
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          key=serialization.load_pem_private_key(pathlib.Path('private/key.pem').read_bytes(),password=None)
          enc=''
          url=key.decrypt(base64.b64decode(enc),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode()
          u=urllib.parse.urlparse(url);assert u.scheme=='https' and u.netloc=='storage.googleapis.com' and u.path.startswith('/adm--audio-playback--7d--public/mcp-preview/')
          print('::add-mask::'+url);r=requests.get(url,timeout=45,allow_redirects=False);r.raise_for_status()
          out=pathlib.Path('audio');out.mkdir();(out/'01_reading_fixed.mp3').write_bytes(r.content)
          pathlib.Path('private/key.pem').unlink()
          from faster_whisper import WhisperModel
          m=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          seg,info=m.transcribe(str(out/'01_reading_fixed.mp3'),language='ja',word_timestamps=True,beam_size=5,vad_filter=True,condition_on_previous_text=False)
          ss=[{'start':s.start,'end':s.end,'text':s.text,'words':[{'word':w.word,'start':w.start,'end':w.end,'probability':w.probability} for w in s.words]} for s in seg]
          data={'file':'01_reading_fixed.mp3','duration':info.duration,'segments':ss};(out/'reading_fixed_words.json').write_text(json.dumps(data,ensure_ascii=False,indent=2));print(data)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topopolis-opening-fixed
          path: audio/
          retention-days: 2
          if-no-files-found: error
