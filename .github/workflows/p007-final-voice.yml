name: P007 refined narration
on:
  push:
    branches: [production/p007-20260921]
    paths: [.github/workflows/p007-final-voice.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Encrypted one-time audio handoff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os,urllib.request,urllib.parse,urllib.error,json,pathlib,base64,subprocess,hashlib,time
          root='https://api.github.com/repos/'+os.environ['REPO']+'/contents/workbench/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def get(n):
              req=urllib.request.Request(root+n+'?ref='+urllib.parse.quote(os.environ['BRANCH'],safe=''),headers=headers)
              with urllib.request.urlopen(req) as r:return json.load(r)
          key='/tmp/ephemeral.pem'
          subprocess.run(['openssl','genpkey','-algorithm','RSA','-pkeyopt','rsa_keygen_bits:3072','-out',key],check=True,stderr=subprocess.DEVNULL)
          os.chmod(key,0o600)
          pub=subprocess.check_output(['openssl','pkey','-in',key,'-pubout']).decode();kid=hashlib.sha256(pub.encode()).hexdigest()
          content=json.dumps({'pem':pub,'key_sha256':kid,'run_id':os.environ['RUN']})
          body={'message':'P007 refined narration ephemeral public key','branch':os.environ['BRANCH'],'content':base64.b64encode(content.encode()).decode()}
          try:body['sha']=get('p007_final_key.json')['sha']
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
          req=urllib.request.Request(root+'p007_final_key.json',data=json.dumps(body).encode(),headers=headers,method='PUT')
          with urllib.request.urlopen(req) as r:r.read()
          payload=None
          for _ in range(90):
              try:
                  obj=json.loads(base64.b64decode(get('p007_final_cipher.json')['content']))
                  if obj['key_sha256']==kid:payload=obj;break
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
              time.sleep(5)
          if payload is None:raise RuntimeError('No encrypted input received')
          pathlib.Path('voice').mkdir();record=[]
          try:
              for item in payload['items']:
                  if item['name'] not in ['02.mp3','03.mp3']:raise ValueError('Unexpected name')
                  url=subprocess.check_output(['openssl','pkeyutl','-decrypt','-inkey',key,'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],input=base64.b64decode(item['sealed_url'])).decode()
                  if not url.startswith('https://storage.googleapis.com/adm--audio-playback--7d--public/'):raise ValueError('Unexpected host')
                  with urllib.request.urlopen(url,timeout=60) as r:data=r.read(15000000)
                  pathlib.Path('voice',item['name']).write_bytes(data)
                  record.append({'name':item['name'],'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
              pathlib.Path('voice/recovery_refined.json').write_text(json.dumps({'run_id':os.environ['RUN'],'files':record},indent=2))
          finally:pathlib.Path(key).unlink(missing_ok=True)
          PY
      - name: Verify refined Japanese speech
        run: |
          python -m pip install --quiet faster-whisper
          python - <<'PY'
          from faster_whisper import WhisperModel
          import pathlib,json
          model=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          out={}
          for p in sorted(pathlib.Path('voice').glob('*.mp3')):
              seg,info=model.transcribe(str(p),language='ja',beam_size=5,word_timestamps=True,condition_on_previous_text=False)
              out[p.name]={'duration':info.duration,'segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word} for w in s.words]} for s in seg]}
              print(p.name,''.join(s['text'] for s in out[p.name]['segments']),flush=True)
          pathlib.Path('voice/alignment_refined.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p007-refined-voice
          path: voice/*
          retention-days: 1
      - name: Remove ephemeral private key
        if: always()
        run: rm -f /tmp/ephemeral.pem
