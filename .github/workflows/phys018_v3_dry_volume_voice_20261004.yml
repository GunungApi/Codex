name: PHYS018 dry interior clarification
on:
  push:
    paths: ['.github/workflows/phys018_v3_dry_volume_voice_20261004.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover commissioned voice and alignment
        run: |
          python -m pip -q install playwright requests av faster-whisper
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p clarification
          python - <<'PY'
          from pathlib import Path
          import requests,json,urllib.parse,hashlib,av
          from playwright.sync_api import sync_playwright
          from faster_whisper import WhisperModel
          # User-commissioned narration. No credentials or temporary media URLs are persisted.
          cid='a349142ad56a4f0aa439f5cb05f1442d'
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              page=browser.new_page()
              page.goto('https://www.aidocmaker.com/g0/audio?name='+cid,wait_until='domcontentloaded',timeout=90000)
              sources=[]
              for attempt in range(65):
                  sources=page.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                  if sources:break
                  page.wait_for_timeout(1000)
              assert sources,'No playable commissioned source'
              src=sources[0];u=urllib.parse.urlparse(src)
              assert u.scheme=='https' and u.netloc=='storage.googleapis.com'
              print('::add-mask::'+src)
              r=requests.get(src,timeout=60);r.raise_for_status()
              p=Path('clarification/03.mp3');p.write_bytes(r.content)
              a=av.open(str(p));duration=a.duration/av.time_base;decoded=sum(1 for f in a.decode(audio=0))
              assert 3<duration<30 and decoded>10
              browser.close()
          Path('clarification/retrieval.json').write_text(json.dumps({'file':p.name,'duration':duration,'sha256':hashlib.sha256(r.content).hexdigest(),'bytes':len(r.content),'decoded_frames':decoded},indent=2))
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          segments,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
          d={'file':p.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segments]}
          Path('clarification/03_words.json').write_text(json.dumps(d,ensure_ascii=False,indent=2))
          print('Verified duration:',duration,'Transcription:',[s['text'] for s in d['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phys018-v3-clarification
          path: clarification/
          retention-days: 2
