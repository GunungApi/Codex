name: Heionreki P001 production assets
on:
  push:
    branches: ['heionreki-p001-production-20260918']
    paths: ['.github/workflows/heionreki-p001-assets.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare tools
        run: |
          python -m pip install -q faster-whisper
          mkdir -p output/audio output/wheels
          python -m pip download --only-binary=:all: --python-version 313 --abi cp313 --dest output/wheels moderngl glcontext
      - name: Retrieve generated narration and check Japanese timings
        shell: python
        run: |
          import json, hashlib, urllib.request, pathlib
          from faster_whisper import WhisperModel
          ids = ['f1726284-328b-400e-8c55-7caebb2f52d8', '856295bc-193c-4522-ae89-0a7b3e01bc65', '290ae989-8bbd-4b52-a663-29c86798408b']
          model = WhisperModel('medium', device='cpu', compute_type='int8', cpu_threads=4)
          records = []
          for i, uid in enumerate(ids, 1):
              path = pathlib.Path(f'output/audio/part{i:02d}.mp3')
              url = f'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/{uid}.mp3'
              urllib.request.urlretrieve(url, path)
              assert path.stat().st_size > 1000
              segs, info = model.transcribe(str(path), language='ja', beam_size=5, word_timestamps=True, initial_prompt='ビッグバン。宇宙。目印。空間。膨張。平穏暦全史。')
              rec = {'file':path.name, 'duration':info.duration, 'sha256':hashlib.sha256(path.read_bytes()).hexdigest(), 'segments':[]}
              for s in segs:
                  rec['segments'].append({'start':s.start, 'end':s.end, 'text':s.text, 'words':[{'word':w.word, 'start':w.start, 'end':w.end, 'probability':w.probability} for w in s.words]})
              records.append(rec)
              print(json.dumps(rec, ensure_ascii=False), flush=True)
          pathlib.Path('output/transcription.json').write_text(json.dumps(records, ensure_ascii=False, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: heionreki-p001-assets
          path: output/
          retention-days: 1
