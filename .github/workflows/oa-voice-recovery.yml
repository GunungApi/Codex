name: OA voice recovery
on:
  push:
    paths:
      - '.github/workflows/oa-voice-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Download narration segments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p voice
          curl -fL --retry 3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/86abf923-2ea4-4164-a8b9-a5fecd3a1758.mp3' -o voice/01.mp3
          curl -fL --retry 3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/53857634-c9cd-41ad-b81b-8acee2621c14.mp3' -o voice/02.mp3
          curl -fL --retry 3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/549cf9ea-c497-45bc-b5d7-ceb387a44f01.mp3' -o voice/03.mp3
          curl -fL --retry 3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/7abfdff1-8d19-4bec-9d42-9e73ff7a56c8.mp3' -o voice/04.mp3
          curl -fL --retry 3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/0988ff76-4718-427a-a995-f2cf00758dd1.mp3' -o voice/05.mp3
          curl -fL --retry 3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/793e27d8-4cfc-4af0-a2df-c39f537b3dd1.mp3' -o voice/06.mp3
          file voice/*.mp3
          ls -lh voice
      - name: Upload recovered audio
        uses: actions/upload-artifact@v4
        with:
          name: oa-narration-segments
          path: voice/*.mp3
          retention-days: 1
# recovery trigger 2
