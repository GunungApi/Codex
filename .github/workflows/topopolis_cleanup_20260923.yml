name: Topopolis scoped temporary artifact cleanup
on:
  push:
    paths: ['.github/workflows/topopolis_cleanup_20260923.yml']
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const recoveredTopopolisArtifacts = [10714230178, 10714235239, 10713219834, 10713862441, 10713918331];
            for (const artifact_id of recoveredTopopolisArtifacts) {
              try {
                await github.rest.actions.deleteArtifact({owner: 'GunungApi', repo: 'Codex', artifact_id});
                core.info(`Removed recovered temporary artifact ${artifact_id}`);
              } catch (error) {
                if (error.status !== 404 && error.status !== 410) throw error;
                core.info(`Temporary artifact ${artifact_id} is already absent`);
              }
            }
