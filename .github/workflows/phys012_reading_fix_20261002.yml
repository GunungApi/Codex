name: PHYS012 reading refinement
on:
  push:
    paths: ['.github/workflows/phys012_reading_fix_20261002.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve and align refined sentence
        run: |
          python -m pip -q install playwright requests faster-whisper
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p refined
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from faster_whisper import WhisperModel
          import requests,json,urllib.parse,hashlib
          with sync_playwright() as pw:
              b=pw.chromium.launch(headless=True);p=b.new_page()
              p.goto('https://www.aidocmaker.com/g0/audio?name=cdf264ab9baf46aeac7e566e0d2acd42',wait_until='domcontentloaded',timeout=90000)
              for n in range(65):
                  src=p.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                  if src:break
                  p.wait_for_timeout(1000)
              assert src
              u=urllib.parse.urlparse(src[0]);assert u.scheme=='https' and u.netloc=='storage.googleapis.com'
              print('::add-mask::'+src[0]);r=requests.get(src[0],timeout=60);r.raise_for_status()
              f=Path('refined/02.mp3');f.write_bytes(r.content);b.close()
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          seg,info=model.transcribe(str(f),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
          d={'file':f.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in seg]}
          Path('refined/02_words.json').write_text(json.dumps(d,ensure_ascii=False,indent=2))
          Path('refined/retrieval.json').write_text(json.dumps({'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'bytes':f.stat().st_size,'duration':info.duration},indent=2))
          print([s['text'] for s in d['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phys012-refined-02
          path: refined/
          retention-days: 2
