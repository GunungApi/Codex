name: Knowsense media 20260922
on:
  push:
    paths: ['.github/workflows/knowsense_media_20260922.yml']
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: b001-private-transfer-key
          run-id: 35629230020
          github-token: ${{ github.token }}
          path: private
      - name: Retrieve generated audio without publishing temporary URLs
        env:
          CIPHER: 
        run: |
          python -m pip install requests cryptography faster-whisper
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p out/voice out/model
          python - <<'PY'
          import os, base64, pathlib, requests, subprocess, json, time, re, html
          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives import hashes
          key=load_pem_private_key(pathlib.Path('private/key.pem').read_bytes(),password=None)
          ids=key.decrypt(base64.b64decode(os.environ['CIPHER']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode().split(',')
          report=[]
          for i,cid in enumerate(ids,1):
            p=pathlib.Path(f'out/voice/{i:02}.mp3'); ok=False
            for attempt in range(4):
              r=requests.get('https://www.aidocmaker.com/g0/audio',params={'name':cid},timeout=90)
              if r.status_code==200:
                p.write_bytes(r.content)
                v=subprocess.run(['ffprobe','-v','error','-show_format','-of','json',str(p)],capture_output=True)
                if v.returncode==0:
                  report.append({'file':p.name,'bytes':len(r.content),'duration':json.loads(v.stdout)['format']['duration']});ok=True;break
                if 'text' in r.headers.get('Content-Type',''):
                  pathlib.Path(f'out/voice/{i:02}_response.html').write_text(r.text)
              time.sleep(8+attempt*6)
            if not ok: raise RuntimeError(f'Audio retrieval failed for segment {i}; status {r.status_code}, type {r.headers.get("Content-Type")}')
          pathlib.Path('out/voice/retrieval.json').write_text(json.dumps(report,indent=2));print(report)
          PY
      - name: Licensed reference head
        if: always()
        run: |
          mkdir -p out/model
          curl -fsSL --retry 2 https://raw.githubusercontent.com/mrdoob/three.js/r180/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb -o out/model/head.glb
          curl -fsSL --retry 2 https://raw.githubusercontent.com/mrdoob/three.js/r180/examples/models/gltf/LeePerrySmith/README -o out/model/README_license.txt || true
      - name: Align Japanese narration
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          import pathlib,json
          model=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(pathlib.Path('out/voice').glob('*.mp3')):
            segs,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,initial_prompt='オリオン腕。ノウセンス。直接神経接続。')
            out=[]
            for s in segs:
              out.append({'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]})
            p.with_suffix('.words.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
            print(p.name,[s['text'] for s in out])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowsense-media
          path: out/
          retention-days: 1
          if-no-files-found: error
