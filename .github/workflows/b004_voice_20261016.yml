name: B004 original narration
on:
  push:
    paths: ['.github/workflows/b004_voice_20261016.yml']
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start established narration engine
        run: |
          docker run -d --name voicevox -p '127.0.0.1:50021:50021' voicevox/voicevox_engine:cpu-latest
          python -m pip -q install requests faster-whisper
      - name: Generate originals and independently transcribe
        run: python b004_20261016/voice.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b004-original-narration-with-timings
          path: |
            b004/audio/raw/
            b004_20261016/voice.py
          retention-days: 14
