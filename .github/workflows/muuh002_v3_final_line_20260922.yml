name: MUUH002 v3 final neural comparison line
on:
  push:
    paths: ['.github/workflows/muuh002_v3_final_line_20260922.yml']
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright faster-whisper
          python -m playwright install --with-deps chromium
      - name: Recover the existing generated audio from its public player
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.parse,json,hashlib
          from playwright.sync_api import sync_playwright
          out=Path('result');out.mkdir()
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True);page=browser.new_page()
              page.goto('https://www.aidocmaker.com/g0/audio?name=80bcdff5d8ee4a3a994346c43c354659',wait_until='networkidle',timeout=60000)
              page.wait_for_timeout(3500)
              sources=page.locator('audio,source').evaluate_all('(els)=>els.map(e=>e.currentSrc||e.src).filter(Boolean)')
              found=False
              for url in sources:
                  u=urllib.parse.urlparse(url)
                  if u.scheme!='https' or not (u.hostname=='storage.googleapis.com' or u.hostname.endswith('aidocmaker.com')):continue
                  r=page.request.get(url);assert r.ok;data=r.body();assert 5000<len(data)<10000000
                  (out/'nerve_compare_final.mp3').write_bytes(data);found=True;break
              assert found;browser.close()
          from faster_whisper import WhisperModel
          model=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          segments,info=model.transcribe(str(out/'nerve_compare_final.mp3'),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
          result={'duration':info.duration,'segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segments]}
          (out/'nerve_compare_final.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print([(s['start'],s['end'],s['text']) for s in result['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: muuh002-v3-neural-final
          path: result/
          retention-days: 2
          if-no-files-found: error
