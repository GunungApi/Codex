name: P021 volume two narration
on:
  push:
    paths: ['.github/workflows/p021_narration_20261012.yml']
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start established Japanese voice
        run: |
          docker run -d --name voicevox -p '127.0.0.1:50021:50021' voicevox/voicevox_engine:cpu-latest
          python -m pip -q install requests av faster-whisper
      - name: Render authored narration and preserve pronunciation
        run: |
          mkdir -p narration
          python - <<'PY'
          import json,time,hashlib,requests,av
          from pathlib import Path
          b='http://127.0.0.1:50021'
          for attempt in range(90):
              try:
                  r=requests.get(b+'/speakers',timeout=5)
                  if r.ok:break
              except requests.RequestException:pass
              time.sleep(2)
          r.raise_for_status()
          speaker=next(s for s in r.json() if s['name']=='四国めたん')
          sid=next(s['id'] for s in speaker['styles'] if s['name']=='ノーマル')
          texts=['二つの銀河が、重なっていく。中の星も、次々にぶつかるんだろうか。','星と星のあいだには、広い空間がある。星を小さく表示すると、そのすき間の広さが見えてくる。','星どうしの直接の衝突は、まれ。それでも、互いの重力は星の進む道を曲げ、長い尾のように引き伸ばす。','一方、広く漂うガスは、ぶつかり合う。接触した場所で、ガスが押し縮められ、熱くなる。','その後、冷えて密になった場所では、新しい星が生まれることもある。同じ出会いでも、星とガスでは、振る舞いが違う。','銀河が出会うと、材料の集まり方が変わる。その変化が、次の星と世界が育つ場所をつくっていく。']
          readings=[('銀河','ギンガ',1),('衝突','ショウトツ',0),('重力','ジュウリョク',1),('接触','セッショク',0),('圧縮','アッシュク',0),('空間','クウカン',0)]
          for word,kana,accent in readings:
              requests.post(b+'/user_dict_word',params={'surface':word,'pronunciation':kana,'accent_type':accent,'priority':8},timeout=20).raise_for_status()
          records=[]
          for i,text in enumerate(texts,1):
              spoken=text.replace('星','ほし').replace('長い尾','長い、お').replace('密になった','みつになった')
              r=requests.post(b+'/audio_query',params={'text':spoken,'speaker':sid},timeout=60);r.raise_for_status();q=r.json()
              q.update(speedScale=1.0,pitchScale=-0.015,intonationScale=1.08,volumeScale=1.0,prePhonemeLength=0.15,postPhonemeLength=0.25,outputSamplingRate=48000,outputStereo=False)
              r=requests.post(b+'/synthesis',params={'speaker':sid},json=q,timeout=120);r.raise_for_status()
              p=Path('narration',f'{i:02d}.wav');p.write_bytes(r.content)
              a=av.open(str(p));duration=a.duration/av.time_base;frames=sum(1 for _ in a.decode(audio=0));assert 2<duration<25 and frames>1
              p.with_name(p.stem+'_query.json').write_text(json.dumps(q,ensure_ascii=False,indent=2))
              records.append({'file':p.name,'text':text,'spoken_text':spoken,'duration':duration,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'kana':q.get('kana'),'decoded_frames':frames})
              print(p.name,duration,q.get('kana'))
          Path('narration/retrieval.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          Path('narration/voice.json').write_text(json.dumps({'engine':'VOICEVOX','engine_version':requests.get(b+'/version').json(),'speaker':speaker,'selected_style_id':sid,'credit':'VOICEVOX:四国めたん','readings':readings},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p021-original-voice
          path: narration/
          retention-days: 3
      - name: Measure word timings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(Path('narration').glob('*.wav')):
              segs,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              d={'file':p.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segs]}
              p.with_name(p.stem+'_words.json').write_text(json.dumps(d,ensure_ascii=False,indent=2));print(p.name,[s['text'] for s in d['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p021-voice-with-timings
          path: narration/
          retention-days: 3
