name: P004 speech crosscheck
on:
  push:
    paths: ['.github/workflows/p004-audio-review-20260920.yml']
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests faster-whisper
      - name: Decode saved audio and crosscheck words
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,io,zipfile,pathlib,requests,json
          r=requests.get('https://api.github.com/repos/GunungApi/Codex/actions/artifacts/10594643340/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']},timeout=90);r.raise_for_status()
          zipfile.ZipFile(io.BytesIO(r.content)).extractall('voice')
          from faster_whisper import WhisperModel
          m=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(pathlib.Path('voice').glob('*.mp3')):
              segs,info=m.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=True,initial_prompt='宇宙。原子。クォーク。グルーオン。陽子。中性子。原子核。目印。膨張。')
              out=[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in (s.words or [])]} for s in segs]
              p.with_suffix('.medium.json').write_text(json.dumps(out,ensure_ascii=False,indent=2));print(p.name,[s['text'] for s in out],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p004-speech-crosscheck
          path: voice/*.medium.json
          retention-days: 1
