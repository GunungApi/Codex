name: VAH short pronunciation pickup
on:
  push:
    paths: ['.github/workflows/vah-pickup-20260920.yml']
permissions:
  contents: write
jobs:
  pickup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cryptography requests faster-whisper
      - name: Receive encrypted input and decode pickup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,base64,time,pathlib,requests,av
          from cryptography.hazmat.primitives.asymmetric import rsa,padding
          from cryptography.hazmat.primitives import serialization,hashes
          from urllib.parse import urlparse
          key=rsa.generate_private_key(public_exponent=65537,key_size=3072)
          pub=key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo)
          api='https://api.github.com/repos/'+os.environ['REPO']+'/contents/';h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          pp='.production/vah-pickup-public.pem';ip='.production/vah-pickup-encrypted.txt'
          r=requests.put(api+pp,headers=h,json={'message':'Publish ephemeral pickup key','content':base64.b64encode(pub).decode()},timeout=30);r.raise_for_status()
          for i in range(120):
              r=requests.get(api+ip,headers=h,timeout=30)
              if r.status_code==200:break
              time.sleep(5)
          r.raise_for_status()
          ct=base64.b64decode(base64.b64decode(r.json()['content']).strip())
          url=key.decrypt(ct,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode()
          assert urlparse(url).hostname=='storage.googleapis.com' and urlparse(url).path.startswith('/adm--audio-playback--7d--public/mcp-preview/')
          r=requests.get(url,timeout=90);r.raise_for_status();pathlib.Path('pickup').mkdir();pathlib.Path('pickup/pickup.mp3').write_bytes(r.content)
          with av.open('pickup/pickup.mp3') as c: dur=sum(f.samples/f.sample_rate for f in c.decode(audio=0))
          print('Decoded pickup seconds:',dur,flush=True)
          for path in (pp,ip):
              r=requests.get(api+path,headers=h,timeout=30)
              if r.status_code==200:requests.delete(api+path,headers=h,json={'message':'Remove completed pickup relay material','sha':r.json()['sha']},timeout=30).raise_for_status()
          from faster_whisper import WhisperModel
          m=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          ss,info=m.transcribe('pickup/pickup.mp3',language='ja',word_timestamps=True,beam_size=5)
          out=[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word} for w in s.words]} for s in ss]
          pathlib.Path('pickup/pickup.words.json').write_text(json.dumps(out,ensure_ascii=False,indent=2));print(out,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vah-pronunciation-pickup
          path: pickup/
          retention-days: 1
