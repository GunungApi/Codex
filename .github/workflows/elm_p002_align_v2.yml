name: ELM P002 word alignment v2
on:
  push:
    paths: ['.github/workflows/elm_p002_align_v2.yml']
permissions:
  contents: read
  actions: read
jobs:
  alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: elm-p002-new-voice-first
          path: narration
          run-id: 38125715821
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: elm-p002-new-voice-second
          path: narration
          run-id: 38125715821
          github-token: ${{ github.token }}
      - name: Measure Japanese word times from PCM waveforms
        run: |
          python -m pip -q install faster-whisper soundfile scipy
          mkdir -p alignment
          python -u - <<'PY'
          from pathlib import Path
          from faster_whisper import WhisperModel
          from scipy.signal import resample_poly
          import soundfile as sf,numpy as np,json,math
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(Path('narration').glob('*.wav')):
              audio,sr=sf.read(p,dtype='float32')
              assert audio.ndim==1
              g=math.gcd(sr,16000)
              audio=resample_poly(audio,16000//g,sr//g).astype(np.float32)
              segs,info=model.transcribe(audio,language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              data={'file':p.name,'duration':info.duration,'model':'large-v3-turbo','waveform_sample_rate':16000,'segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segs]}
              Path('alignment',p.stem+'_words.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
              print(p.name,[s['text'] for s in data['segments']],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elm-p002-v2-word-alignment
          path: alignment/
          retention-days: 7
