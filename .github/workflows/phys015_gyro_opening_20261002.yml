name: PHYS015 opening audio test
on:
  push:
    paths: ['.github/workflows/phys015_gyro_opening_20261002.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover commissioned opening and word timestamps
        run: |
          python -m pip -q install playwright requests av faster-whisper
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p narration
          python - <<'PY'
          from pathlib import Path
          import requests,json,urllib.parse,hashlib,av
          from playwright.sync_api import sync_playwright
          from faster_whisper import WhisperModel
          # Public durable playback ID only; signed media URLs are never persisted.
          cid='b46a2b39fbb14e01b060e8e65146fa39'
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              page=browser.new_page()
              page.goto('https://www.aidocmaker.com/g0/audio?name='+cid,wait_until='domcontentloaded',timeout=90000)
              sources=[]
              for attempt in range(65):
                  sources=page.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                  if sources:break
                  page.wait_for_timeout(1000)
              assert sources,'No playable source'
              src=sources[0];u=urllib.parse.urlparse(src)
              assert u.scheme=='https' and u.netloc=='storage.googleapis.com'
              print('::add-mask::'+src)
              response=requests.get(src,timeout=60);response.raise_for_status()
              p=Path('narration/01.mp3');p.write_bytes(response.content)
              audio=av.open(str(p));duration=audio.duration/av.time_base;frames=sum(1 for x in audio.decode(audio=0))
              assert 2<duration<25 and frames>10
              browser.close()
          Path('narration/retrieval.json').write_text(json.dumps({'file':p.name,'duration':duration,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'decoded_frames':frames},indent=2))
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          segments,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
          data={'file':p.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segments]}
          Path('narration/01_words.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          print([s['text'] for s in data['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phys015-opening-test
          path: narration/
          retention-days: 2
