name: P036 original narration
on:
  push:
    paths: ['.github/workflows/p036_narration_20261014.yml']
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start licensed VOICEVOX Japanese speech synthesis
        run: |
          docker run -d --name voicevox -p '127.0.0.1:50021:50021' voicevox/voicevox_engine:cpu-latest
          python -m pip -q install requests av faster-whisper
      - name: Synthesize six original segments
        run: |
          mkdir -p narration
          python - <<'PY'
          import json,time,hashlib,requests,av
          from pathlib import Path
          b='http://127.0.0.1:50021'
          for attempt in range(120):
              try:
                  r=requests.get(b+'/speakers',timeout=5)
                  if r.ok: break
              except requests.RequestException: pass
              time.sleep(2)
          r.raise_for_status()
          person=next(s for s in r.json() if s['name']=='四国めたん')
          sid=next(s['id'] for s in person['styles'] if s['name']=='ノーマル')
          texts=["生まれた惑星が、少しずつ星へ近づいていく。ぐるぐる回っているだけなのに、回る場所まで変わる。どうしてだろう。","惑星は、周囲のガスを重力で揺さぶる。すると円盤には、波のような濃い筋が生まれ、渦巻くように広がる。","おもしろいのは、ガスも惑星を引っ張り返すこと。内側と外側のガスは、惑星の回転に違う向きの作用を与える。","その差が、回る勢い、角運動量を変えていく。外側からの作用が勝つと、惑星はゆっくり内側へ移動する。","でも、円盤の温度やガスの広がり方が違えば、力の釣り合いも変わる。今度は外へ移動する場合もあるんだ。","移動した先では、温度も、集められる材料も変わる。いま見えている惑星の住所には、ガスが残る時代の旅の歴史が隠れているかもしれない。"]
          readings=[('惑星','ワクセイ',0),('円盤','エンバン',0),('重力','ジュウリョク',1),('角運動量','カクウンドウリョウ',5),('軌道','キドウ',0),('密度','ミツド',1),('移動','イドウ',0)]
          for word,kana,accent in readings:
              requests.post(b+'/user_dict_word',params={'surface':word,'pronunciation':kana,'accent_type':accent,'priority':9},timeout=20).raise_for_status()
          records=[]
          for i,text in enumerate(texts,1):
              spoken=text.replace('角運動量','かくうんどうりょう').replace('円盤','えんばん').replace('渦巻く','うずまく').replace('ガス円盤','ガスえんばん')
              q=requests.post(b+'/audio_query',params={'text':spoken,'speaker':sid},timeout=90).json()
              q.update(speedScale=1.01,pitchScale=-0.015,intonationScale=1.08,volumeScale=1.0,prePhonemeLength=.15,postPhonemeLength=.25,outputSamplingRate=48000,outputStereo=False)
              r=requests.post(b+'/synthesis',params={'speaker':sid},json=q,timeout=120);r.raise_for_status()
              p=Path('narration',f'{i:02d}.wav');p.write_bytes(r.content)
              a=av.open(str(p));duration=a.duration/av.time_base; frames=sum(1 for _ in a.decode(audio=0))
              assert 2<duration<22 and frames>1
              p.with_name(p.stem+'_query.json').write_text(json.dumps(q,ensure_ascii=False,indent=2))
              records.append({'file':p.name,'text':text,'spoken_text':spoken,'duration':duration,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'kana':q.get('kana'),'decoded_frames':frames})
              print(p.name,duration,q.get('kana'),flush=True)
          Path('narration/retrieval.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          Path('narration/voice.json').write_text(json.dumps({'engine':'VOICEVOX','engine_version':requests.get(b+'/version').json(),'speaker':person,'selected_style_id':sid,'credit':'VOICEVOX:四国めたん','readings':readings},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p036-original-narration
          path: narration/
          retention-days: 3
      - name: Measure speech word timings with ASR
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel
          m=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(Path('narration').glob('*.wav')):
              segs,info=m.transcribe(str(p),language='ja',word_timestamps=True,beam_size=4,vad_filter=False)
              d={'file':p.name,'duration':info.duration,'model':'small','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segs]}
              p.with_name(p.stem+'_words.json').write_text(json.dumps(d,ensure_ascii=False,indent=2));print(p.name,[s['text'] for s in d['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p036-narration-with-timings
          path: narration/
          retention-days: 3
