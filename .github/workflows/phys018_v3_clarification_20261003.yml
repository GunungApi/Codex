name: PHYS018 v3 clarification preparation
on:
  push:
    paths: ['.github/workflows/phys018_v3_clarification_20261003.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve commissioned narration and align Japanese words
        run: |
          python -m pip -q install playwright requests av faster-whisper
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p assets/narration assets/wheels
          python - <<'PY'
          from pathlib import Path
          import requests,json,urllib.parse,hashlib,av
          from playwright.sync_api import sync_playwright
          from faster_whisper import WhisperModel
          cid='49d2c19da74044338b691e6f8d4baf67'
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              page=browser.new_page()
              page.goto('https://www.aidocmaker.com/g0/audio?name='+cid,wait_until='domcontentloaded',timeout=90000)
              sources=[]
              for attempt in range(65):
                  sources=page.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                  if sources: break
                  page.wait_for_timeout(1000)
              assert sources,'No playable narration source'
              src=sources[0];u=urllib.parse.urlparse(src)
              assert u.scheme=='https' and u.netloc=='storage.googleapis.com'
              print('::add-mask::'+src)
              r=requests.get(src,timeout=60);r.raise_for_status()
              f=Path('assets/narration/03.mp3');f.write_bytes(r.content)
              a=av.open(str(f));duration=a.duration/av.time_base;decoded=sum(1 for x in a.decode(audio=0))
              assert 3<duration<25 and decoded>10
              browser.close()
          Path('assets/narration/retrieval.json').write_text(json.dumps({'file':f.name,'context_id':cid,'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'duration':duration,'decoded_frames':decoded},indent=2))
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          segments,info=model.transcribe(str(f),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
          d={'file':f.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segments]}
          Path('assets/narration/03_words.json').write_text(json.dumps(d,ensure_ascii=False,indent=2))
          print([s['text'] for s in d['segments']])
          PY
      - name: Obtain exact recorded public rendering wheels for offline local editing
        run: |
          python -m pip download --only-binary=:all: --platform manylinux_2_17_x86_64 --python-version 313 --implementation cp --abi cp313 --no-deps --dest assets/wheels moderngl==5.12.0 glcontext==3.0.0
          sha256sum assets/wheels/*.whl > assets/wheels/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phys018-v3-clarification-assets
          path: assets/
          retention-days: 2
