name: PHYS018 v3 final sentence reading
on:
  push:
    paths: ['.github/workflows/phys018_v3_clarification_20261003.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve final commissioned sentence and word timings
        run: |
          python -m pip -q install playwright requests av faster-whisper
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p sentence
          python - <<'PY'
          from pathlib import Path
          import requests,json,urllib.parse,hashlib,av
          from playwright.sync_api import sync_playwright
          from faster_whisper import WhisperModel
          cid='a04e4d74ec384dbbbfa2bf37a50b8a39'
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True);page=browser.new_page()
              page.goto('https://www.aidocmaker.com/g0/audio?name='+cid,wait_until='domcontentloaded',timeout=90000)
              sources=[]
              for attempt in range(65):
                  sources=page.locator('audio, audio source').evaluate_all('(xs)=>xs.map(x=>x.currentSrc||x.src).filter(Boolean)')
                  if sources:break
                  page.wait_for_timeout(1000)
              assert sources
              src=sources[0];u=urllib.parse.urlparse(src);assert u.scheme=='https' and u.netloc=='storage.googleapis.com'
              print('::add-mask::'+src)
              r=requests.get(src,timeout=60);r.raise_for_status();f=Path('sentence/03_end.mp3');f.write_bytes(r.content)
              a=av.open(str(f));duration=a.duration/av.time_base;frames=sum(1 for x in a.decode(audio=0));assert frames>10
              browser.close()
          Path('sentence/retrieval.json').write_text(json.dumps({'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'duration':duration,'decoded_frames':frames,'context_id':cid},indent=2))
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          segments,info=model.transcribe(str(f),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
          d={'file':f.name,'duration':info.duration,'model':'large-v3-turbo','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segments]}
          Path('sentence/03_end_words.json').write_text(json.dumps(d,ensure_ascii=False,indent=2));print([s['text'] for s in d['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phys018-v3-final-sentence
          path: sentence/
          retention-days: 2
