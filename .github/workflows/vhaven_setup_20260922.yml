name: Virtual Haven protected media preparation
on:
  push:
    paths: ['.github/workflows/vhaven_setup_20260922.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare temporary transfer key and local rendering wheels
        run: |
          mkdir -p private wheels
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out private/key.pem 2>/dev/null
          openssl pkey -in private/key.pem -pubout -out public.pem
          cat public.pem
          python -m pip download --only-binary=:all: --dest wheels moderngl glcontext
      - uses: actions/upload-artifact@v4
        with:
          name: vhaven-transfer-key
          path: private/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: vhaven-render-wheels
          path: wheels/
          retention-days: 2
          if-no-files-found: error
