name: P064 local renderer dependencies
on:
  push:
    branches: ['production/p064-v2-runtime-20261027']
    paths: ['.github/workflows/p064_render_wheels_20261028.yml']
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip download --only-binary=:all: --no-deps moderngl==5.12.0 glcontext==3.0.0 -d renderer-wheels
          sha256sum renderer-wheels/*.whl > renderer-wheels/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p064-local-renderer-wheels
          path: renderer-wheels
          retention-days: 2
