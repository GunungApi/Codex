name: MUUH003 completed public narration recovery
on:
  push:
    paths: ['.github/workflows/muuh003_assets_20260922.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare public playback reader
        run: |
          python -m pip install playwright faster-whisper
          python -m playwright install --with-deps chromium
      - name: Read the completed existing public voiceovers
        run: |
          python - <<'PY'
          from pathlib import Path
          import asyncio,json,hashlib,urllib.parse,time
          from playwright.async_api import async_playwright
          out=Path('audio');out.mkdir()
          ids=['21ebfd09d5554169b500a3df6acfba7e','c532b4cf7f824157a2dd3d1af2ea8150','cdb823b6558645c1a74a6f5d3efaa3e0','fe64ae8dc7c3444f902243e06875c65b','ff24b3a08df9498294c15abc6dbee910','d274dfd2b30b4422ab5bab96cc786506']
          async def recover(browser,i,cid):
            page=await browser.new_page();target=out/f'{i:02d}.mp3';events=[]
            async def receive(r):
              try:
                host=urllib.parse.urlparse(r.url).hostname or ''
                if not(host.endswith('aidocmaker.com') or host=='storage.googleapis.com'):return
                ct=r.headers.get('content-type','')
                events.append({'host':host,'path':urllib.parse.urlparse(r.url).path,'type':ct,'status':r.status})
                if 'audio/' in ct:
                  data=await r.body()
                  if 5000<len(data)<10000000:target.write_bytes(data)
              except Exception:pass
            page.on('response',receive)
            try:
              await page.goto('https://www.aidocmaker.com/g0/audio?name='+cid,wait_until='domcontentloaded',timeout=60000)
              for attempt in range(45):
                await page.wait_for_timeout(2000)
                sources=await page.locator('audio,video,source').evaluate_all('(els)=>els.map(e=>e.currentSrc||e.src).filter(Boolean)')
                if sources:
                  for u in sources:
                    q=urllib.parse.urlparse(u)
                    if q.scheme=='https' and (q.hostname=='storage.googleapis.com' or (q.hostname or '').endswith('aidocmaker.com')):
                      r=await page.request.get(u)
                      if r.ok:
                        data=await r.body()
                        if 5000<len(data)<10000000:target.write_bytes(data)
                if target.exists():break
              (out/f'{i:02d}_page.txt').write_text(await page.locator('body').inner_text())
              (out/f'{i:02d}_requests.json').write_text(json.dumps(events,indent=2))
            except Exception as e:(out/f'{i:02d}_error.txt').write_text(str(e))
            await page.close()
            return {'part':i,'retrieved':target.exists(),'bytes':target.stat().st_size if target.exists() else 0,'sha256':hashlib.sha256(target.read_bytes()).hexdigest() if target.exists() else None}
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              report=await asyncio.gather(*[recover(browser,i,cid) for i,cid in enumerate(ids,1)])
              await browser.close()
            (out/'retrieval.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
            if not all(x['retrieved'] for x in report):raise SystemExit('Some narration media is unavailable; no alternate voice adopted.')
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muuh003-original-audio
          path: audio/
          retention-days: 2
      - name: Independent Japanese transcription and word times
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from faster_whisper import WhisperModel
          model=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          out=Path('alignment');out.mkdir()
          for p in sorted(Path('audio').glob('*.mp3')):
            segments,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False,condition_on_previous_text=False)
            result={'duration':info.duration,'segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in segments]}
            (out/(p.stem+'.json')).write_text(json.dumps(result,ensure_ascii=False,indent=2))
            print(p.name,[(s['start'],s['end'],s['text']) for s in result['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: muuh003-word-times
          path: alignment/
          retention-days: 2
