name: OA edible table bootstrap 20260920
on:
  push:
    paths:
      - '.github/workflows/oa-edible-bootstrap-20260920.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare render dependencies and private transfer key
        run: |
          mkdir -p transfer/wheels transfer/research
          python -m pip download --only-binary=:all: moderngl glcontext -d transfer/wheels
          python -m pip install requests beautifulsoup4
          python - <<'PY'
          import os, pathlib, requests
          from bs4 import BeautifulSoup
          root=pathlib.Path('transfer')
          (root/'transfer.key').write_bytes(os.urandom(32))
          u='https://www.orionsarm.com/eg-article/4793e60398ecd'
          r=requests.get(u,timeout=60); r.raise_for_status()
          (root/'research'/'edible_table.html').write_text(r.text,encoding='utf-8')
          text=BeautifulSoup(r.text,'html.parser').get_text('\n',strip=True)
          (root/'research'/'edible_table.txt').write_text(text,encoding='utf-8')
          print(text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: oa-edible-bootstrap-private
          path: transfer/
          retention-days: 1
          if-no-files-found: error
