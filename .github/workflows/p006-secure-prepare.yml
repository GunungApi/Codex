name: P006 secure preparation
on:
  push:
    paths:
      - '.github/workflows/p006-secure-prepare.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare rendering wheels and temporary encryption key
        run: |
          mkdir -p package/wheels secure
          python -m pip download --only-binary=:all: --dest package/wheels moderngl==5.12.0 glcontext==3.0.0
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out secure/private.pem 2>/dev/null
          openssl pkey -in secure/private.pem -pubout -out package/public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: p006-secure-key
          path: secure/private.pem
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: p006-render-dependencies
          path: package/
          retention-days: 1
