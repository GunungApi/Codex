name: MUUH002 v2 temporary transfer preparation
on:
  push:
    paths: ['.github/workflows/muuh002_v2_bootstrap_20260922.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare transfer key and offline renderer wheels
        run: |
          python -m pip install cryptography
          mkdir -p transfer wheels
          python - <<'PY'
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          from pathlib import Path
          k=rsa.generate_private_key(public_exponent=65537,key_size=3072)
          Path('transfer/key.pem').write_bytes(k.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()))
          print(k.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo).decode())
          PY
          python -m pip download --only-binary=:all: --dest wheels moderngl==5.12.0 glcontext==3.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: muuh002-v2-private-transfer-key
          path: transfer/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: muuh002-v2-render-wheels
          path: wheels/
          retention-days: 2
