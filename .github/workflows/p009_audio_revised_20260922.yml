name: P009 corrected pronunciation recovery
on:
  push:
    paths: ['.github/workflows/p009_audio_revised_20260922.yml']
permissions:
  contents: read
  actions: read
jobs:
  revised:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: p009-transfer-key
          path: private
          run-id: 35651659079
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover corrected generated voice clips
        run: |
          python -m pip install cryptography requests
          mkdir -p revised
          python - <<'PY'
          import pathlib,json,base64,requests,urllib.parse,hashlib
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          key=serialization.load_pem_private_key(pathlib.Path('private/key.pem').read_bytes(),password=None)
          data=json.loads(pathlib.Path('production_transfer/p009_revised.encrypted.json').read_text())
          assert set(data)=={'1','2','5','6'}
          records=[]
          for i,e in data.items():
              url=key.decrypt(base64.b64decode(e),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode()
              u=urllib.parse.urlparse(url)
              assert u.scheme=='https' and u.netloc=='storage.googleapis.com' and u.path.startswith('/adm--audio-playback--7d--public/mcp-preview/') and u.path.endswith('.mp3')
              print('::add-mask::'+url)
              r=requests.get(url,timeout=45,allow_redirects=False);r.raise_for_status();assert len(r.content)<10000000
              p=pathlib.Path('revised',f'{int(i):02}.mp3');p.write_bytes(r.content)
              records.append({'file':p.name,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest()})
          pathlib.Path('revised/retrieval.json').write_text(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p009-revised-voice
          path: revised/
          retention-days: 7
      - name: Align revised Japanese speech
        run: |
          python -m pip install faster-whisper
          mkdir -p aligned
          python - <<'PY'
          from faster_whisper import WhisperModel
          import pathlib,json
          model=WhisperModel('large-v3',device='cpu',compute_type='int8',cpu_threads=4)
          for p in sorted(pathlib.Path('revised').glob('*.mp3')):
              seg,info=model.transcribe(str(p),language='ja',word_timestamps=True,beam_size=5,vad_filter=False)
              d={'file':p.name,'duration':info.duration,'model':'large-v3','segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words]} for s in seg]}
              pathlib.Path('aligned',p.stem+'.json').write_text(json.dumps(d,ensure_ascii=False,indent=2));print(p.name,[s['text'] for s in d['segments']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p009-revised-alignment
          path: aligned/
          retention-days: 7
